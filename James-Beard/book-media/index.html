<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>James Beard Media Award Graph</title>
<meta name="description" content="Obsidian-style interactive graph of James Beard Restaurant & Chef Award winners, nominees, and semifinalists." />
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --bg2: #161a22;
    --bg3: #1c2230;
    --border: #2a3344;
    --text: #e8ecf4;
    --muted: #9aa3b5;
    --accent: #c9a227;
    --person: #7aa2ff;
    --book: #5ecf9a;
    --show: #4ecdc4;
    --publisher: #e0a060;
    --publication: #d08050;
    --outlet: #f0a0c0;
    --program: #f5d76e;
    
        --category: #c77dff;
    --year: #6bc6e0;
        --won: #f5d76e;
    --panel-w: 360px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Inter", system-ui, -apple-system, sans-serif; }
  #app { display: grid; grid-template-columns: 280px 1fr; height: 100vh; }
  #app.profile-open { grid-template-columns: 280px 1fr var(--panel-w); }
  aside, #profile { background: var(--bg2); border-color: var(--border); overflow: auto; }
  aside { border-right: 1px solid var(--border); padding: 16px; }
  #profile { border-left: 1px solid var(--border); padding: 16px; display: none; }
  #profile.open { display: block; }
  #main { position: relative; min-width: 0; }
  #graph { width: 100%; height: 100%; display: block; background:
    radial-gradient(ellipse at center, #151a24 0%, #0b0d12 100%); }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 650; letter-spacing: 0.02em; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 12px 0 6px; }
  input[type="search"], input[type="number"], select {
    width: 100%; background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; outline: none;
  }
  input:focus, select:focus { border-color: var(--accent); }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .checks { display: grid; gap: 6px; }
  .checks label { text-transform: none; letter-spacing: 0; font-size: 13px; color: var(--text); display: flex; align-items: center; gap: 8px; margin: 0; cursor: pointer; }
  .swatch { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .btn {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 8px 10px; cursor: pointer; width: 100%; margin-top: 8px;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: #2a2410; border-color: var(--accent); color: var(--accent); }
  #stats { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.6; }
  #toolbar {
    position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 2; pointer-events: none;
  }
  #toolbar > * { pointer-events: auto; }
  .pill {
    background: rgba(22,26,34,0.9); border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font-size: 12px; color: var(--muted); backdrop-filter: blur(8px);
  }
  .pill strong { color: var(--text); font-weight: 600; }
  #searchBox { min-width: 220px; flex: 1; max-width: 360px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  #profile h2 { margin: 0 0 4px; font-size: 18px; }
  #profile .type-tag { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 12px; }
  #profile .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  #profile h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 18px 0 8px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .backlink, .award-row {
    display: block; padding: 8px 10px; border-radius: 8px; background: var(--bg3);
    border: 1px solid transparent; margin-bottom: 6px; cursor: pointer; text-decoration: none; color: inherit;
  }
  .backlink:hover, .award-row:hover { border-color: var(--border); }
  .award-row .yr { color: var(--year); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 999px;
    margin-left: 6px; border: 1px solid var(--border); color: var(--muted); text-transform: uppercase;
  }
  .badge.winner { color: #1a1400; background: var(--won); border-color: transparent; }
  .badge.nominee { color: var(--person); }
  .badge.semifinalist { color: var(--muted); }
  a.src { color: var(--person); font-size: 12px; }
  #closeProfile { float: right; }
  link-line, .empty { color: var(--muted); font-size: 13px; }
  text { pointer-events: none; font-size: 10px; fill: #c5cad6; }
  #graph:not(.zoomed) text.minor { display: none; }
  .node circle { stroke-width: 1.25px; cursor: pointer; }
  .node.dim circle { opacity: 0.15; }
  .node.dim text { opacity: 0.05; }
  .link { stroke: #3a4558; stroke-opacity: 0.45; }
  .link.dim { stroke-opacity: 0.05; }
  .link.hi { stroke: var(--accent); stroke-opacity: 0.85; stroke-width: 2px; }
  #mapView { display: none; position: absolute; inset: 0; padding: 24px; overflow: auto; background: var(--bg); }
  #mapView.open { display: block; }
  .state-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .state-card {
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; cursor: pointer;
  }
  .state-card .n { font-size: 20px; font-weight: 650; }
  .state-card .s { color: var(--muted); font-size: 12px; }
  @media (max-width: 960px) {
    #app, #app.profile-open { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
    #main { order: -1; height: 75vh; }
    aside { border-right: none; border-top: 1px solid var(--border); }
    #profile { order: -1; border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>James Beard Media Award Graph</h1>
    <div class="sub">Book · Broadcast Media · Journalism · Obsidian-style graph</div>

    <label>Search</label>
    <input id="q" type="search" placeholder="Author, book, show, outlet… (Enter)" />

    <label>Year range</label>
    <div class="row">
      <input id="yearMin" type="number" min="1991" max="2024" value="1991" />
      <input id="yearMax" type="number" min="1991" max="2025" value="2024" />
    </div>

    <label>Status</label>
    <div class="checks" id="statusChecks">
      <label><input type="checkbox" value="winner" checked /> Winners</label>
      <label><input type="checkbox" value="nominee" /> Nominees</label>
      <label><input type="checkbox" value="semifinalist" /> Semifinalists</label>
    </div>

    <label>Node types</label>
    <div class="checks" id="typeChecks">
      <label><span class="swatch" style="background:var(--person)"></span><input type="checkbox" value="person" checked /> People</label>
      <label><span class="swatch" style="background:var(--book)"></span><input type="checkbox" value="book" checked /> Books</label>
      <label><span class="swatch" style="background:var(--show)"></span><input type="checkbox" value="show" checked /> Shows</label>
      <label><span class="swatch" style="background:var(--publisher)"></span><input type="checkbox" value="publisher" checked /> Publishers</label>
      <label><span class="swatch" style="background:var(--publication)"></span><input type="checkbox" value="publication" checked /> Publications</label>
      <label><span class="swatch" style="background:var(--outlet)"></span><input type="checkbox" value="outlet" /> Broadcast outlets</label>
      <label><span class="swatch" style="background:var(--category)"></span><input type="checkbox" value="category" checked /> Categories</label>
      <label><span class="swatch" style="background:var(--program)"></span><input type="checkbox" value="program" checked /> Programs</label>
      <label><span class="swatch" style="background:var(--year)"></span><input type="checkbox" value="year" /> Years</label>
    </div>

    <label>Program filter</label>
    <select id="programFilter">
      <option value="">All programs</option>
      <option value="Book">Book</option>
      <option value="Broadcast Media">Broadcast Media</option>
      <option value="Journalism">Journalism</option>
    </select>

    <label>Local graph</label>
    <div class="row">
      <select id="hops">
        <option value="0" selected>Full filtered graph</option>
        <option value="1">1 hop from focus</option>
        <option value="2">2 hops from focus</option>
      </select>
    </div>

    <label>Max nodes</label>
    <select id="maxNodes">
      <option value="500">500</option>
      <option value="1500">1,500</option>
      <option value="4000" selected>4,000</option>
      <option value="100000">All (slower)</option>
    </select>

    <button class="btn" id="resetBtn">Reset camera</button>
    <button class="btn" id="toggleMap" style="display:none">Map</button>

    <div id="stats"></div>
    <div class="legend">
      <span><span class="swatch" style="background:var(--person)"></span>Person</span>
      <span><span class="swatch" style="background:var(--book)"></span>Book</span>
      <span><span class="swatch" style="background:var(--show)"></span>Show</span>
      <span><span class="swatch" style="background:var(--publisher)"></span>Publisher</span>
      <span><span class="swatch" style="background:var(--category)"></span>Category</span>
    </div>
  </aside>

  <div id="main">
    <div id="toolbar">
      <div class="pill" id="countPill">Loading…</div>
      <input id="searchBox" class="pill" type="search" placeholder="Jump to node…" style="background:rgba(22,26,34,0.9);border:1px solid var(--border);color:var(--text);border-radius:999px;padding:6px 14px;" />
    </div>
    <svg id="graph"></svg>
    <div id="mapView">
      <h2 style="margin-top:0">Awards by state (filtered)</h2>
      <p class="sub">Based on place/state links in the current filter set. Click a state to focus.</p>
      <div class="state-grid" id="stateGrid"></div>
    </div>
  </div>

  <div id="profile">
    <button class="btn" id="closeProfile" style="width:auto;float:right;margin:0">Close</button>
    <div id="profileBody"></div>
  </div>
</div>

<script>
const COLORS = {
  person: '#7aa2ff',
  book: '#5ecf9a',
  show: '#4ecdc4',
  publisher: '#e0a060',
  publication: '#d08050',
  outlet: '#f0a0c0',
  category: '#c77dff',
  program: '#f5d76e',
  year: '#6bc6e0',
};

const state = {
  graph: null,
  awards: null,
  nodeById: new Map(),
  focusId: null,
  simulation: null,
  view: null,       // current drawing: { nodes, svg, zoom }
  userMoved: false, // stop auto-fitting once the user pans, zooms or drags
};

async function load() {
  const [graph, awards] = await Promise.all([
    fetch('data/graph.json').then(r => r.json()),
    fetch('data/awards.json').then(r => r.json()),
  ]);
  state.graph = graph;
  state.awards = awards;
  state.nodeById = new Map(graph.nodes.map(n => [n.id, n]));
  // Media awards have no semifinalists; hide statuses with no rows instead of offering a no-op box
  const statuses = new Set(graph.meta.coverage.statuses);
  document.querySelectorAll('#statusChecks input').forEach(i => {
    if (!statuses.has(i.value)) i.closest('label').style.display = 'none';
  });
  const years = graph.meta.coverage.years;
  document.getElementById('yearMin').min = years[0];
  document.getElementById('yearMin').max = years[years.length - 1];
  document.getElementById('yearMax').min = years[0];
  document.getElementById('yearMax').max = years[years.length - 1];
  renderStats();
  applyAndDraw();
}

function checkedValues(id) {
  return [...document.querySelectorAll(`#${id} input:checked`)].map(i => i.value);
}

function renderStats() {
  const m = state.graph.meta.coverage;
  document.getElementById('stats').innerHTML =
    `<div><strong>${m.award_count.toLocaleString()}</strong> award records</div>` +
    `<div>${m.winners} winners · ${m.nominees} nominees · ${m.semifinalists} semifinalists</div>` +
    `<div>Years ${m.years[0]}–${m.years[m.years.length - 1]} · Book / Broadcast / Journalism</div>` +
    `<div>${m.by_program ? Object.entries(m.by_program).map(([k,v]) => k+': '+v).join(' · ') : ''}</div>` +
    `<div style="margin-top:8px">Source: JBF search-past-awards (via public CSV through 2024).</div>`;
}

const REL = { winner: 'won', nominee: 'nominated', semifinalist: 'semifinalist' };

function slug(s) {
  return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'unknown';
}
function nid(kind, ...parts) {
  return `${kind}:${slug(parts.filter(Boolean).join('-'))}`;
}

// Links one award row contributes, as [source, target, rel] (same rules as scripts/build_data.py).
function awardLinks(a) {
  const year = nid('year', String(a.year));
  const prog = nid('program', a.program);
  const cat = nid('category', a.program, a.category || 'Uncategorized');
  const pid = a.person && nid('person', a.person);
  const wid = a.work && nid(a.work_type || 'work', a.work);
  const oid = a.outlet && nid(a.outlet_type || 'outlet', a.outlet);
  const subject = pid || wid || oid;
  const out = [[cat, prog, 'in-program']];
  if (subject) out.push([subject, cat, REL[a.status]], [subject, year, 'in-year'], [subject, prog, 'in-program']);
  if (pid && wid) out.push([pid, wid, a.program === 'Book' ? 'authored' : 'credited-on']);
  if (wid && oid) out.push([wid, oid, a.program === 'Book' ? 'published-by' : a.program === 'Broadcast Media' ? 'aired-on' : 'appeared-in']);
  if (pid && oid && !wid) out.push([pid, oid, a.program === 'Journalism' ? 'wrote-for' : 'affiliated-with']);
  return out;
}

function filterGraph() {
  const y0 = +document.getElementById('yearMin').value;
  const y1 = +document.getElementById('yearMax').value;
  const statuses = new Set(checkedValues('statusChecks'));
  const types = new Set(checkedValues('typeChecks'));
  const program = document.getElementById('programFilter').value;
  const q = document.getElementById('q').value.trim().toLowerCase();
  const hops = +document.getElementById('hops').value;

  // The view is the graph of the award rows that match the filters: no links from other years or statuses.
  const rows = state.awards.awards.filter(a =>
    a.year >= y0 && a.year <= y1 && statuses.has(a.status) && (!program || a.program === program));
  const edgeMap = new Map();
  rows.forEach(a => awardLinks(a).forEach(([source, target, rel]) => {
    if (source && target && source !== target) edgeMap.set(`${source}|${target}|${rel}`, { source, target, rel });
  }));
  const edges = [...edgeMap.values()];
  const touched = new Set();
  edges.forEach(e => { touched.add(e.source); touched.add(e.target); });

  let nodes = [...touched].map(id => state.nodeById.get(id)).filter(n => n && types.has(n.type));
  if (q) {
    const matched = nodes.filter(n => n.label.toLowerCase().includes(q));
    if (matched.length && !matched.some(m => m.id === state.focusId)) state.focusId = matched[0].id;
  }

  // Local hops from focus
  if (hops > 0 && state.focusId) {
    const nbr = new Map();
    edges.forEach(e => {
      if (!nbr.has(e.source)) nbr.set(e.source, new Set());
      if (!nbr.has(e.target)) nbr.set(e.target, new Set());
      nbr.get(e.source).add(e.target);
      nbr.get(e.target).add(e.source);
    });
    const local = new Set([state.focusId]);
    let frontier = [state.focusId];
    for (let h = 0; h < hops; h++) {
      const next = [];
      frontier.forEach(id => (nbr.get(id) || []).forEach(x => { if (!local.has(x)) { local.add(x); next.push(x); } }));
      frontier = next;
    }
    nodes = nodes.filter(n => local.has(n.id));
  }

  // Cap for performance, keeping what is shown linked together
  const totalBeforeCap = nodes.length;
  const maxNodes = +document.getElementById('maxNodes').value;
  let ids = new Set(nodes.map(n => n.id));
  let links = edges.filter(e => ids.has(e.source) && ids.has(e.target));
  if (nodes.length > maxNodes) {
    nodes = capConnected(nodes, links, maxNodes, nodeScore);
    ids = new Set(nodes.map(n => n.id));
    links = links.filter(e => ids.has(e.source) && ids.has(e.target));
  }
  return { nodes, links, truncated: totalBeforeCap > maxNodes, totalBeforeCap };
}

// Award-holders rank by their record; hubs (categories, places, years, programs…) by how many visible links they carry.
function nodeScore(n, degree) {
  if (n.id === state.focusId) return Infinity;
  return n.award_count != null ? (n.win_count || 0) * 3 + n.award_count : degree;
}

// Keep at most `max` nodes, growing outward from the strongest node and always preferring nodes linked to what
// is already kept, so nothing is left floating on its own. A new cluster starts only when nothing linked is left.
function capConnected(nodes, links, max, score) {
  if (nodes.length <= max) return nodes;
  const byId = new Map(nodes.map(n => [n.id, n]));
  const adj = new Map(nodes.map(n => [n.id, []]));
  links.forEach(l => { adj.get(l.source).push(l.target); adj.get(l.target).push(l.source); });
  const LINKED = 1e9;
  const heap = [];
  nodes.forEach(n => heapPush(heap, [score(n, adj.get(n.id).length), n.id]));
  const kept = new Set();
  while (kept.size < max && heap.length) {
    const [, id] = heapPop(heap);
    if (kept.has(id)) continue;
    kept.add(id);
    for (const x of adj.get(id)) {
      if (!kept.has(x)) heapPush(heap, [LINKED + score(byId.get(x), adj.get(x).length), x]);
    }
  }
  return nodes.filter(n => kept.has(n.id));
}

// Max-heap of [priority, id] pairs for capConnected.
function heapPush(h, item) {
  h.push(item);
  let i = h.length - 1;
  while (i > 0) {
    const p = (i - 1) >> 1;
    if (h[p][0] >= h[i][0]) break;
    [h[p], h[i]] = [h[i], h[p]];
    i = p;
  }
}
function heapPop(h) {
  const top = h[0];
  const last = h.pop();
  if (h.length) {
    h[0] = last;
    let i = 0;
    for (;;) {
      const l = 2 * i + 1, r = l + 1;
      let m = i;
      if (l < h.length && h[l][0] > h[m][0]) m = l;
      if (r < h.length && h[r][0] > h[m][0]) m = r;
      if (m === i) break;
      [h[m], h[i]] = [h[i], h[m]];
      i = m;
    }
  }
  return top;
}


function applyAndDraw() {
  const sub = filterGraph();
  draw(sub);
  document.getElementById('countPill').innerHTML =
    `<strong>${sub.nodes.length}</strong> nodes · <strong>${sub.links.length}</strong> edges` +
    (sub.truncated ? ` · capped (from ${sub.totalBeforeCap})` : '');
  updateMap(sub);
}

function draw(sub) {
  if (state.simulation) state.simulation.stop();
  const svg = d3.select('#graph');
  const wrap = document.getElementById('main');
  const width = wrap.clientWidth;
  const height = wrap.clientHeight;
  svg.attr('viewBox', [0, 0, width, height]);
  svg.selectAll('*').remove();

  const gRoot = svg.append('g');
  const zoom = d3.zoom().scaleExtent([0.05, 6]).on('zoom', (event) => {
    if (event.sourceEvent) state.userMoved = true;
    gRoot.attr('transform', event.transform);
    svg.classed('zoomed', event.transform.k >= 1.5);
  });
  svg.call(zoom);
  state.userMoved = false;

  const nodes = sub.nodes.map(d => ({ ...d }));
  const nodeById = new Map(nodes.map(d => [d.id, d]));
  const links = sub.links
    .map(d => ({ ...d, source: nodeById.get(d.source), target: nodeById.get(d.target) }))
    .filter(d => d.source && d.target);

  const link = gRoot.append('g').attr('stroke-linecap', 'round')
    .selectAll('line').data(links).join('line').attr('class', 'link')
    .attr('stroke-width', d => d.rel === 'won' ? 1.6 : 1);

  const node = gRoot.append('g').selectAll('g')
    .data(nodes).join('g').attr('class', 'node')
    .call(d3.drag()
      .on('start', (event, d) => { state.userMoved = true; if (!event.active) simulation.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
      .on('drag', (event, d) => { d.fx = event.x; d.fy = event.y; })
      .on('end', (event, d) => { if (!event.active) simulation.alphaTarget(0); d.fx = null; d.fy = null; }));

  node.append('circle')
    .attr('r', d => radius(d))
    .attr('fill', d => COLORS[d.type] || '#888')
    .attr('stroke', d => d.id === state.focusId ? '#fff' : '#0b0d12')
    .attr('stroke-width', d => d.id === state.focusId ? 2.5 : 1.2)
    .on('click', (event, d) => { event.stopPropagation(); focusNode(d.id); })
    .on('mouseenter', (event, d) => highlight(d.id, links, node, link))
    .on('mouseleave', () => clearHighlight(node, link));

  node.append('title').text(d => `${d.label} (${d.type})`);

  // Small nodes get labels only when zoomed in (or focused)
  node.append('text')
    .attr('x', d => radius(d) + 4)
    .attr('y', 3)
    .classed('minor', d => d.id !== state.focusId && radius(d) < 7 && !['category', 'program', 'year'].includes(d.type))
    .text(d => trimLabel(d.label, d.type));

  const simulation = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(d => d.id).distance(d => d.rel === 'works-at' ? 40 : 70).strength(0.4))
    .force('charge', d3.forceManyBody().strength(-120))
    .force('center', d3.forceCenter(width / 2, height / 2))
    // Gentle pull toward the middle so unconnected nodes don't drift out of view
    .force('x', d3.forceX(width / 2).strength(0.04))
    .force('y', d3.forceY(height / 2).strength(0.04))
    .force('collision', d3.forceCollide().radius(d => radius(d) + 4))
    .on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('transform', d => `translate(${d.x},${d.y})`);
      fitView(false); // camera follows the layout as it spreads out
    });
  state.simulation = simulation;
  state.view = { nodes, svg, zoom };
  fitView(false);
}

// Zoom so every node fits the graph area (below the toolbar), unless the user has taken over the camera.
function fitView(animate, force) {
  if (!state.view || (state.userMoved && !force)) return;
  const { nodes, svg, zoom } = state.view;
  if (!nodes.length) return;
  const wrap = document.getElementById('main');
  const pad = { top: 56, right: 24, bottom: 24, left: 24 };
  const w = wrap.clientWidth - pad.left - pad.right;
  const h = wrap.clientHeight - pad.top - pad.bottom;
  const [x0, x1] = d3.extent(nodes, d => d.x);
  const [y0, y1] = d3.extent(nodes, d => d.y);
  const k = Math.max(0.05, Math.min(2, w / Math.max(1, x1 - x0), h / Math.max(1, y1 - y0)));
  const t = d3.zoomIdentity
    .translate(pad.left + w / 2 - k * (x0 + x1) / 2, pad.top + h / 2 - k * (y0 + y1) / 2)
    .scale(k);
  (animate ? svg.transition().duration(500) : svg).call(zoom.transform, t);
}

function resizeGraph() {
  const wrap = document.getElementById('main');
  d3.select('#graph').attr('viewBox', [0, 0, wrap.clientWidth, wrap.clientHeight]);
  // The camera absorbs size changes; the layout itself stays put.
  fitView(false);
}

// Opening or closing the profile changes the graph's width, so refit after the layout reflows.
function setProfileOpen(open) {
  const profile = document.getElementById('profile');
  if (profile.classList.contains('open') === open) return;
  profile.classList.toggle('open', open);
  document.getElementById('app').classList.toggle('profile-open', open);
  requestAnimationFrame(resizeGraph);
}

function radius(d) {
  if (d.type === 'person' || d.type === 'book' || d.type === 'show') return 5 + Math.min(12, (d.win_count || 0) * 1.8 + (d.award_count || 0) * 0.15);
  if (d.type === 'category') return 8;
  if (d.type === 'year') return 7;
  if (d.type === 'place') return 5;
  return 6;
}

function trimLabel(s, type) {
  if (type === 'year') return s;
  return s.length > 28 ? s.slice(0, 26) + '…' : s;
}

function highlight(id, links, nodeSel, linkSel) {
  const neighbors = new Set([id]);
  links.forEach(l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    if (s === id) neighbors.add(t);
    if (t === id) neighbors.add(s);
  });
  nodeSel.classed('dim', d => !neighbors.has(d.id));
  linkSel.classed('dim', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return !(neighbors.has(s) && neighbors.has(t));
  }).classed('hi', l => {
    const s = typeof l.source === 'object' ? l.source.id : l.source;
    const t = typeof l.target === 'object' ? l.target.id : l.target;
    return s === id || t === id;
  });
}
function clearHighlight(nodeSel, linkSel) {
  nodeSel.classed('dim', false);
  linkSel.classed('dim', false).classed('hi', false);
}

function focusNode(id) {
  state.focusId = id;
  openProfile(id);
  applyAndDraw();
}

function openProfile(id) {
  const n = state.nodeById.get(id);
  if (!n) return;
  setProfileOpen(true);
  const body = document.getElementById('profileBody');

  // Backlinks
  const incoming = state.graph.edges.filter(e => e.target === id);
  const outgoing = state.graph.edges.filter(e => e.source === id);
  const relatedIds = new Set();
  incoming.forEach(e => relatedIds.add(e.source));
  outgoing.forEach(e => relatedIds.add(e.target));
  const related = [...relatedIds].map(rid => state.nodeById.get(rid)).filter(Boolean)
    .sort((a, b) => a.type.localeCompare(b.type) || a.label.localeCompare(b.label));

  // Award timeline from awards.json
  let awards = [];
  if (n.type === 'person') {
    awards = state.awards.awards.filter(a => a.person === n.label);
  } else if (n.type === 'book') {
    awards = state.awards.awards.filter(a => a.book === n.label || a.work === n.label);
  } else if (n.type === 'show') {
    awards = state.awards.awards.filter(a => a.show === n.label || a.work === n.label);
  } else if (n.type === 'publisher') {
    awards = state.awards.awards.filter(a => a.publisher === n.label);
  } else if (n.type === 'publication') {
    awards = state.awards.awards.filter(a => a.publication === n.label);
  } else if (n.type === 'outlet') {
    awards = state.awards.awards.filter(a => a.company === n.label || a.outlet === n.label);
  } else if (n.type === 'category') {
    awards = state.awards.awards.filter(a => a.category === n.label && (!n.program || a.program === n.program));
  } else if (n.type === 'program') {
    awards = state.awards.awards.filter(a => a.program === n.label);
  } else if (n.type === 'year') {
    awards = state.awards.awards.filter(a => a.year === +n.label);
  }
  awards = awards.slice().sort((a, b) => b.year - a.year || a.category.localeCompare(b.category));

  const sources = [...new Set(awards.map(a => a.source_url).filter(Boolean))];

  body.innerHTML = `
    <div class="type-tag">${n.type}</div>
    <h2>${escapeHtml(n.label)}</h2>
    <div class="meta">
      ${n.program ? escapeHtml(n.program) : ''}
      ${n.award_count ? ` · ${n.award_count} award mentions` : ''}
      ${n.win_count ? ` · ${n.win_count} wins` : ''}
    </div>
    <h3>Award history</h3>
    <div>${awards.length ? awards.slice(0, 80).map(a => `
      <div class="award-row">
        <span class="yr">${a.year}</span>
        <strong>${escapeHtml(a.category)}</strong>
        <span class="badge ${a.status}">${a.status}</span>
        <div style="color:var(--muted);font-size:12px;margin-top:2px">
          ${a.program ? '<em>'+escapeHtml(a.program)+'</em> · ' : ''}${a.person ? escapeHtml(a.person) : ''}
          ${a.work ? ' · ' + escapeHtml(a.work) : ''}${a.outlet ? ' · ' + escapeHtml(a.outlet) : ''}
        </div>
      </div>`).join('') : '<div class="empty">No award rows for this node under current data.</div>'}
      ${awards.length > 80 ? `<div class="empty">Showing 80 of ${awards.length}</div>` : ''}
    </div>
    <h3>Connected notes</h3>
    <div>${related.slice(0, 60).map(r => `
      <a class="backlink" href="#" data-id="${r.id}">
        <span class="badge">${r.type}</span> ${escapeHtml(r.label)}
      </a>`).join('') || '<div class="empty">No connections in full graph.</div>'}
    </div>
    <h3>Sources</h3>
    <div>${sources.map(s => `<div><a class="src" href="${s}" target="_blank" rel="noopener">${s}</a></div>`).join('') || '<div class="empty">See data/awards.json provenance.</div>'}</div>
  `;
  body.querySelectorAll('[data-id]').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); focusNode(el.getAttribute('data-id')); });
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function updateMap(sub) { /* media site: no geo map */ }

// Filters apply as soon as they change; search runs on Enter.
let filterTimer;
document.querySelector('aside').addEventListener('input', e => {
  if (e.target.id === 'q') return;
  clearTimeout(filterTimer);
  filterTimer = setTimeout(applyAndDraw, 200);
});
document.getElementById('resetBtn').addEventListener('click', () => {
  state.userMoved = false;
  fitView(true, true);
});
document.getElementById('closeProfile').addEventListener('click', () => setProfileOpen(false));
document.getElementById('toggleMap').addEventListener('click', () => {
  document.getElementById('mapView').classList.toggle('open');
});
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') applyAndDraw(); });
document.getElementById('searchBox').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = state.graph.nodes.find(n => n.label.toLowerCase().includes(q));
  if (hit) focusNode(hit.id);
});
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resizeGraph, 150);
});

load().catch(err => {
  document.getElementById('countPill').textContent = 'Failed to load data: ' + err.message;
  console.error(err);
});
</script>
