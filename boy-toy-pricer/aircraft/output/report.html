: [{"site": "Barnstormers", "price": 87500.0, "price_with_fees": null, "link": "https://www.barnstormers.com/classified-2058945-1971-Cherokee-180.html", "listing_id": "barnstormers:2058945"}], "family": "pa28-180-181", "serial": ""}, {"listing_id": "barnstormers:2079232", "title": "1966 PIPER CHEROKEE PA-28-180C", "year": 1966, "price": 125000.0, "mileage": 6340, "deal_rating": "", "is_hot": false, "is_new": false, "price_drop": "", "posted_date": "October 20, 2026", "city": "Valrico, FL", "distance": "", "dealer": "", "site_code": "Barnstormers", "description": "1966 Piper Cherokee PA-28-180C, 6,340 TTAF. O-360, 30 SMOH by Zephyr Engines. Prop 360 SMOH. Garmin GTN 650 GPS/navigation/radio, GI 275 engine monitor, dual G5s, Garmin 340 audio panel, GNC 255A navigation/radio and Stratus ESG ADS-B transponder. Knots 2U flap, aileron and stabilator gap seals, wing root fairings, Met-Co wingtips, Rosen visors and .250-inch glass throughout. Logs since new; spar eddy current testing completed. Sold with fresh annual. Hangared KZPH. PA-28-180 C", "link": "https://www.barnstormers.com/classified-2079232-1966-PIPER-CHEROKEE-PA-28-180C.html", "image_url": "https://barnstormers.s3.amazonaws.com/media/listing_images/thumbnail/thumbnail_image_2079232_1_1792527711.jpeg?136", "msrp": null, "msrp_source": "", "vin": "", "extra_sites": "", "sources": [{"site": "Barnstormers", "price": 125000.0, "price_with_fees": null, "link": "https://www.barnstormers.com/classified-2079232-1966-PIPER-CHEROKEE-PA-28-180C.html", "listing_id": "barnstormers:2079232"}], "family": "pa28-180-181", "serial": ""}, {"listing_id": "barnstormers:2078386", "title": "1967 PIPER CHEROKEE 180", "year": 1967, "price": 105000.0, "mileage": null, "deal_rating": "", "is_hot": false, "is_new": false, "price_drop": "", "posted_date": "October 15, 2026", "city": "Plummer, ID", "distance": "", "dealer": "", "site_code": "Barnstormers", "description": "Nice clean 1967 Piper Cherokee 180C. TT 3861 SMOH 705, IFR capable, ADSB out, all logs, no damage history, always hangered. Great flying aircraft! Only selling due to medical issue. ADS-B", "link": "https://www.barnstormers.com/classified-2078386-1967-Piper-Cherokee-180.html", "image_url": "https://barnstormers.s3.amazonaws.com/media/listing_images/thumbnail/thumbnail_image_2078386_1_1792086087.jpeg?8977", "msrp": null, "msrp_source": "", "vin": "", "extra_sites": "", "sources": [{"site": "Barnstormers", "price": 105000.0, "price_with_fees": null, "link": "https://www.barnstormers.com/classified-2078386-1967-Piper-Cherokee-180.html", "listing_id": "barnstormers:2078386"}], "family": "pa28-180-181", "serial": ""}, {"listing_id": "barnstormers:2077414", "title": "PA28-180", "year": null, "price": 129500.0, "mileage": null, "deal_rating": "", "is_hot": false, "is_new": false, "price_drop": "", "posted_date": "October 9, 2026", "city": "Fort Lauderdale, FL", "distance": "", "dealer": "LOGIN AVIATION", "site_code": "Barnstormers", "description": "Privately owned, low time, and never used as a trainer, it’s a rare, well-kept example of one of aviation’s most loved airframes, now with a freshly overhauled engine. Inside Cockpit stunning glass panel: a Garmin G3X and G5 paired with the Garmin GFC 500 autopilot, an Avidyne IFD 550 navigator, and an L3 Lynx NGT-9000 ADS-B In/Out. It’s a modern IFR-capable cockpit in a proven. The cabin matches the panel, with a rich red interior, LED lighting, an iPad iPort adapter, USB chargers, and a durable vinyl floor. Classic Cherokee reliability, a modern panel, and private-owner care. PA-28-180", "link": "https://www.barnstormers.com/classified-2077414-PA28-180.html", "image_url": "https://barnstormers.s3.amazonaws.com/media/listing_images/thumbnail/thumbnail_image_2077414_1_1791587898.jpeg?525", "msrp": null, "msrp_source": "", "vin": "", "extra_sites": "", "sources": [{"site": "Barnstormers", "price": 129500.0, "price_with_fees": null, "link": "https://www.barnstormers.com/classified-2077414-PA28-180.html", "listing_id": "barnstormers:2077414"}], "family": "pa28-180-181", "serial": ""}], "url": "", "bat": [], "autotrader_url": ""}, {"title": "README", "slug": "readme", "kind": "readme", "saved_slug": "", "scraped_at": "", "warnings": [], "rows": [], "html": "\u003ch1\u003eAircraft listing tracker\u003c/h1\u003e\n\u003cp\u003eThis folder tracks used airplanes and writes \u003cstrong\u003eone self-contained HTML file\u003c/strong\u003e with a tab for each search:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003cstrong\u003eCirrus SR22\u003c/strong\u003e — SR22, SR22T, SR22 TN, G1 through G7 / G7+, GTS, and turbo. SR20 listings are collected on this tab and stay hidden until \u003cstrong\u003eInclude SR20\u003c/strong\u003e is checked.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCirrus Vision Jet\u003c/strong\u003e — SF50, including G1, G2, G2+, G3, G3+, and Arrivee when a listing states them.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eCubCrafters\u003c/strong\u003e — Carbon Cub SS, EX, EX-2, EX-3, FX, FX-2, FX-3, Top Cub (CC18-180), XCub, NXCub, Sport Cub S2, and any other CubCrafters airplane a listing names. Piper Super Cubs and other makers\u0026#x27; cubs are excluded, including Piper ads on CubCrafters\u0026#x27; own inventory page.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003ePiper PA-28-180/181\u003c/strong\u003e — Cherokee 180 (including lettered 180C/180D and Cherokee Challenger), Cherokee Archer, Archer II, Archer III, Archer DX, Archer LX, and a Pilot 100i when the listing states PA-28-181. Any spelling of Cherokee 180, Archer, PA-28-180, PA-28-181, PA28-180, or PA28-181. Warrior, Arrow, Dakota, Cruiser, Cherokee 140/150/160/235/236, and a 140 with a 180 hp conversion are excluded.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eREADME\u003c/strong\u003e — this document, rendered into the report when the HTML file is built.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eEach airplane tab uses the same layout: filters, sorting, badges, thumbnails, per-site prices, a \u003cstrong\u003eData as of\u003c/strong\u003e line (America/Chicago), and click-through. The usage column is \u003cstrong\u003eHours\u003c/strong\u003e (total time), not mileage. The identifier column is the \u003cstrong\u003eN-number\u003c/strong\u003e. Clicking a row, title, thumbnail, or chart point opens the lowest-priced listing. Each price in the Source column opens that site\u0026#x27;s own listing.\u003c/p\u003e\n\u003cp\u003eThis folder is the aircraft tracker. It listens on port 8766 so it can run beside another local tool on port 8765.\u003c/p\u003e\n\u003cp\u003eIn this repository the project lives at:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003eboy-toy-pricer/aircraft\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eThe report file is:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft/output/report.html\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eThe same page is served at \u003ccode\u003ehttp://127.0.0.1:8766\u003c/code\u003e when the local server is running.\u003c/p\u003e\n\u003ch2\u003eFolder layout\u003c/h2\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003ePath\u003c/th\u003e\u003cth\u003eWhat it does\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003elistings.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eField list and text parsing. Decides family (SR22, SR20, SF50, CubCrafters) from the title, make, and model. Does not invent a generation, engine time, or gear type.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003escrape_sources.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOne scraper per site. Cirrus and ASO are JSON. The other sites are HTML loaded in a browser.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003efetch.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOpens Chromium, then Google Chrome if Chromium is missing. If the browser is blocked and a plain HTTP GET still returns the page, that response is used for HTML. JSON tries the browser\u0026#x27;s request client, then HTTP.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003emerge_listings.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOne row per airplane. N-number first, serial number if there is no N-number. The row price is the lowest USD ask. Every site keeps its own price and link.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esaved_store.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eReads and writes \u003ccode\u003esaved/\u0026lt;slug\u0026gt;/\u003c/code\u003e. Freshness window, America/Chicago timestamps, atomic CSV writes.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003erefresh_searches.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eRefreshes one or all searches and rebuilds the report when the snapshot changes.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003egenerate_report.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eBuilds \u003ccode\u003eoutput/report.html\u003c/code\u003e from the saved CSVs and from this README.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003ereport_template.html\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eThe page shell (styles and tab behavior). Not opened directly.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esearch_server.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eLocal server on port \u003cstrong\u003e8766\u003c/strong\u003e. Serves the report, refreshes a stale tab in the background, and runs UPDATE.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003erun_sr22_weekly.sh\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eEntry point for GitHub Actions, the UPDATE button, and the Mac launchd job. Uses \u003ccode\u003e.venv/bin/python\u003c/code\u003e when that virtualenv exists.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003erequirements.txt\u003c/code\u003e\u003c/td\u003e\u003ctd\u003ePython packages. Right now that is Playwright.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003etest_listings.py\u003c/code\u003e, \u003ccode\u003etest_saved.py\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eParser, merge, report, and snapshot tests. No network.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esaved/freshness.json\u003c/code\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003efresh_days\u003c/code\u003e (default 2).\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003esaved/sr22/\u003c/code\u003e, \u003ccode\u003esaved/sf50/\u003c/code\u003e, \u003ccode\u003esaved/cubcrafters/\u003c/code\u003e, \u003ccode\u003esaved/pa28-180-181/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOne snapshot per tab. See below.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eoutput/report.html\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eThe file you open or share.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eoutput/update.log\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eLog from the UPDATE button. Not committed.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003eoutput/launchd.log\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eLog from the Mac schedule, if you install the plist below. Not committed.\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003e\u003ccode\u003e.venv/\u003c/code\u003e\u003c/td\u003e\u003ctd\u003eOptional virtualenv created in the first-run steps. Not committed.\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eInside each \u003ccode\u003esaved/\u0026lt;slug\u0026gt;/\u003c/code\u003e folder:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003e\u003ccode\u003ecirrus.csv\u003c/code\u003e on the SR22 and Vision Jet snapshots, or \u003ccode\u003ecubcrafters.csv\u003c/code\u003e on the CubCrafters snapshot, plus \u003ccode\u003easo.csv\u003c/code\u003e, \u003ccode\u003eglobalair.csv\u003c/code\u003e, \u003ccode\u003eaircraftdealer.csv\u003c/code\u003e, and \u003ccode\u003ebarnstormers.csv\u003c/code\u003e when that source returned rows.\u003c/li\u003e\u003cli\u003e\u003ccode\u003econtroller.csv\u003c/code\u003e, \u003ccode\u003etradeaplane.csv\u003c/code\u003e, \u003ccode\u003eaircraftcom.csv\u003c/code\u003e, \u003ccode\u003eaerotrader.csv\u003c/code\u003e, and \u003ccode\u003eebay.csv\u003c/code\u003e appear only after that source succeeds. A blocked run does not create an empty file.\u003c/li\u003e\u003cli\u003e\u003ccode\u003emerged.csv\u003c/code\u003e is one row per airplane.\u003c/li\u003e\u003cli\u003e\u003ccode\u003emeta.json\u003c/code\u003e has \u003ccode\u003escraped_at\u003c/code\u003e and any warnings.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003ePrerequisites\u003c/h2\u003e\n\u003cul\u003e\u003cli\u003emacOS with Google Chrome installed (\u003ca href=\"https://www.google.com/chrome/\"\u003egoogle.com/chrome\u003c/a\u003e). The scraper tries Playwright\u0026#x27;s Chromium first and Chrome second.\u003c/li\u003e\u003cli\u003ePython 3.11 or 3.12. Check with \u003ccode\u003epython3 --version\u003c/code\u003e. The weekly GitHub Action uses 3.12. Install from \u003ca href=\"https://www.python.org/downloads/\"\u003epython.org\u003c/a\u003e or with \u003ccode\u003ebrew install python@3.12\u003c/code\u003e if \u003ccode\u003epython3\u003c/code\u003e is missing.\u003c/li\u003e\u003cli\u003eNetwork access the first time Playwright downloads Chromium, and whenever a refresh hits the listing sites.\u003c/li\u003e\u003c/ul\u003e\n\u003ch2\u003eFirst run\u003c/h2\u003e\n\u003cp\u003eFrom the repository root:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecd boy-toy-pricer/aircraft\npython3 -m venv .venv\nsource .venv/bin/activate\npython3 -m pip install -r requirements.txt\npython3 -m playwright install chromium\npython3 -m unittest test_listings.py test_saved.py\npython3 generate_report.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003egenerate_report.py\u003c/code\u003e rewrites \u003ccode\u003eoutput/report.html\u003c/code\u003e from the saved snapshots and from this README. A clone already contains a snapshot, so this does not scrape.\u003c/p\u003e\n\u003cp\u003eOpen the report with no server:\u003c/p\u003e\n\u003cp\u003e\u003ccode\u003e\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft/output/report.html\u003c/code\u003e\u003c/p\u003e\n\u003cp\u003eOr start the server (leave this Terminal open):\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003ecd boy-toy-pricer/aircraft\nsource .venv/bin/activate\npython3 search_server.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThen open \u003ccode\u003ehttp://127.0.0.1:8766\u003c/code\u003e. Port 8765 is the car tracker. This server uses 8766 so both can run.\u003c/p\u003e\n\u003cp\u003eLater commands in this README assume the virtualenv is active (\u003ccode\u003esource .venv/bin/activate\u003c/code\u003e) and the current directory is the folder above.\u003c/p\u003e\n\u003ch2\u003eRefresh\u003c/h2\u003e\n\u003cp\u003eA normal refresh skips a search whose \u003ccode\u003emerged.csv\u003c/code\u003e is still inside the freshness window (default \u003cstrong\u003e2 days\u003c/strong\u003e).\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 refresh_searches.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eForce every search, including fresh ones:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 refresh_searches.py --force\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThe same forced refresh, which is what UPDATE and the schedule run:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e./run_sr22_weekly.sh --force\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eOne tab only. The slug is \u003ccode\u003esr22\u003c/code\u003e, \u003ccode\u003esf50\u003c/code\u003e, \u003ccode\u003ecubcrafters\u003c/code\u003e, or \u003ccode\u003epa28-180-181\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 refresh_searches.py --slug cubcrafters\npython3 refresh_searches.py --slug pa28-180-181\npython3 refresh_searches.py --slug sf50\npython3 refresh_searches.py --slug sr22 --force\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRebuild the HTML without scraping. Do this after editing this README if you did not just refresh:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 generate_report.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eA refresh that actually scrapes rebuilds the report, including the README tab. A refresh that skips because the snapshot is fresh leaves \u003ccode\u003eoutput/report.html\u003c/code\u003e as it was.\u003c/p\u003e\n\u003cp\u003eChange the window for one run with \u003ccode\u003e--fresh-days 3\u003c/code\u003e, or for every run by editing \u003ccode\u003esaved/freshness.json\u003c/code\u003e (\u003ccode\u003e{\u0026quot;fresh_days\u0026quot;: 2}\u003c/code\u003e) or by setting \u003ccode\u003eSR22_FRESH_DAYS\u003c/code\u003e.\u003c/p\u003e\n\u003ch2\u003eTests\u003c/h2\u003e\n\u003cpre\u003e\u003ccode\u003epython3 -m unittest test_listings.py test_saved.py\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eThese do not open a browser and do not hit the listing sites.\u003c/p\u003e\n\u003ch2\u003eSnapshots, freshness, and UPDATE\u003c/h2\u003e\n\u003cp\u003eEach search is fresh while \u003ccode\u003emeta.json\u003c/code\u003e \u003ccode\u003escraped_at\u003c/code\u003e is at most \u003ccode\u003efresh_days\u003c/code\u003e old and \u003ccode\u003emerged.csv\u003c/code\u003e exists. The \u003cstrong\u003eData as of\u003c/strong\u003e line is that timestamp in America/Chicago. The page header uses the oldest tab.\u003c/p\u003e\n\u003cp\u003eOpening the HTML file by itself shows the saved rows. Nothing is scraped.\u003c/p\u003e\n\u003cp\u003eWhen \u003ccode\u003esearch_server.py\u003c/code\u003e is running and a tab is older than the window, that tab refreshes in the background and the table updates in place. The first view is not blocked. If the refresh fails, the saved rows stay and a warning appears on the tab.\u003c/p\u003e\n\u003cp\u003eThe \u003cstrong\u003eUPDATE\u003c/strong\u003e button is shown only when the page was loaded from the local server. It runs \u003ccode\u003erun_sr22_weekly.sh --force\u003c/code\u003e (every search, even fresh ones) and then reloads. Progress is written to \u003ccode\u003eoutput/update.log\u003c/code\u003e.\u003c/p\u003e\n\u003cp\u003eA source that fails keeps its previous CSV. The report still shows those rows, and \u003ccode\u003emeta.json\u003c/code\u003e records the warning. If a source already has at least 5 saved rows and a later scrape returns nothing, that empty result is treated as a failure so a broken parser cannot wipe the last good file.\u003c/p\u003e\n\u003cp\u003eNew and price-drop marks compare this \u003ccode\u003emerged.csv\u003c/code\u003e with the previous one. The first snapshot has nothing marked new.\u003c/p\u003e\n\u003ch2\u003eWeekly GitHub Actions\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003e.github/workflows/aircraft-pricer-weekly.yml\u003c/code\u003e runs \u003ccode\u003eboy-toy-pricer/aircraft/run_sr22_weekly.sh\u003c/code\u003e with working directory \u003ccode\u003eboy-toy-pricer/aircraft\u003c/code\u003e on Mondays at 7:00 AM America/Chicago. GitHub\u0026#x27;s clock is UTC, so the file schedules both 12:00 and 13:00 UTC and continues only when the Chicago hour is 07. That keeps the same local hour across daylight-saving changes.\u003c/p\u003e\n\u003cp\u003eScheduled workflows run from the default branch (\u003ccode\u003emain\u003c/code\u003e) only. After this branch is merged, you can also run it by hand: GitHub → Actions → \u003cstrong\u003eRefresh aircraft for-sale report\u003c/strong\u003e → \u003cstrong\u003eRun workflow\u003c/strong\u003e. The job commits \u003ccode\u003eboy-toy-pricer/aircraft/output/report.html\u003c/code\u003e and \u003ccode\u003eboy-toy-pricer/aircraft/saved\u003c/code\u003e when they change. It runs \u003ccode\u003epython3 scripts/check_privacy.py\u003c/code\u003e before that commit. It needs the \u003ccode\u003econtents: write\u003c/code\u003e permission already set in the workflow file. No repository secret is required.\u003c/p\u003e\n\u003cp\u003eA Monday run still skips a search whose snapshot is inside the freshness window. The Mac launchd job below is the same script on your computer. You do not need both, but they do not conflict: a fresh snapshot is left alone.\u003c/p\u003e\n\u003ch2\u003eMac launchd job\u003c/h2\u003e\n\u003cp\u003eThis runs the weekly script every Monday at 7:00 on the Mac\u0026#x27;s own clock. Set the Mac time zone to America/Chicago if you want that to match the GitHub schedule. Use a LaunchAgent (your user), not a LaunchDaemon, so Playwright can see the browsers you installed.\u003c/p\u003e\n\u003cp\u003eSave this as \u003ccode\u003e~/Library/LaunchAgents/com.example.aircraft-scan.plist\u003c/code\u003e:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003e\u0026lt;?xml version=\u0026quot;1.0\u0026quot; encoding=\u0026quot;UTF-8\u0026quot;?\u0026gt;\n\u0026lt;!DOCTYPE plist PUBLIC \u0026quot;-//Apple//DTD PLIST 1.0//EN\u0026quot; \u0026quot;http://www.apple.com/DTDs/PropertyList-1.0.dtd\u0026quot;\u0026gt;\n\u0026lt;plist version=\u0026quot;1.0\u0026quot;\u0026gt;\n\u0026lt;dict\u0026gt;\n  \u0026lt;key\u0026gt;Label\u0026lt;/key\u0026gt;\n  \u0026lt;string\u0026gt;com.example.aircraft-scan\u0026lt;/string\u0026gt;\n  \u0026lt;key\u0026gt;WorkingDirectory\u0026lt;/key\u0026gt;\n  \u0026lt;string\u0026gt;\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft\u0026lt;/string\u0026gt;\n  \u0026lt;key\u0026gt;EnvironmentVariables\u0026lt;/key\u0026gt;\n  \u0026lt;dict\u0026gt;\n    \u0026lt;key\u0026gt;PATH\u0026lt;/key\u0026gt;\n    \u0026lt;string\u0026gt;/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin\u0026lt;/string\u0026gt;\n  \u0026lt;/dict\u0026gt;\n  \u0026lt;key\u0026gt;ProgramArguments\u0026lt;/key\u0026gt;\n  \u0026lt;array\u0026gt;\n    \u0026lt;string\u0026gt;/bin/bash\u0026lt;/string\u0026gt;\n    \u0026lt;string\u0026gt;\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft/run_sr22_weekly.sh\u0026lt;/string\u0026gt;\n  \u0026lt;/array\u0026gt;\n  \u0026lt;key\u0026gt;StartCalendarInterval\u0026lt;/key\u0026gt;\n  \u0026lt;dict\u0026gt;\n    \u0026lt;key\u0026gt;Weekday\u0026lt;/key\u0026gt;\n    \u0026lt;integer\u0026gt;1\u0026lt;/integer\u0026gt;\n    \u0026lt;key\u0026gt;Hour\u0026lt;/key\u0026gt;\n    \u0026lt;integer\u0026gt;7\u0026lt;/integer\u0026gt;\n    \u0026lt;key\u0026gt;Minute\u0026lt;/key\u0026gt;\n    \u0026lt;integer\u0026gt;0\u0026lt;/integer\u0026gt;\n  \u0026lt;/dict\u0026gt;\n  \u0026lt;key\u0026gt;StandardOutPath\u0026lt;/key\u0026gt;\n  \u0026lt;string\u0026gt;\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft/output/launchd.log\u0026lt;/string\u0026gt;\n  \u0026lt;key\u0026gt;StandardErrorPath\u0026lt;/key\u0026gt;\n  \u0026lt;string\u0026gt;\u0026lt;repo\u0026gt;/boy-toy-pricer/aircraft/output/launchd.log\u0026lt;/string\u0026gt;\n\u0026lt;/dict\u0026gt;\n\u0026lt;/plist\u0026gt;\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003eWeekday\u003c/code\u003e 1 is Monday. Replace \u003ccode\u003e\u0026lt;repo\u0026gt;\u003c/code\u003e with the absolute path of your clone. Save the plist with a text editor to \u003ccode\u003e~/Library/LaunchAgents/com.example.aircraft-scan.plist\u003c/code\u003e, then load it:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003emkdir -p ~/Library/LaunchAgents\nlaunchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.example.aircraft-scan.plist\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eCheck it:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elaunchctl print gui/$(id -u)/com.example.aircraft-scan\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eRun it once without waiting for Monday:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elaunchctl kickstart -p gui/$(id -u)/com.example.aircraft-scan\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eUnload it with:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003elaunchctl bootout gui/$(id -u)/com.example.aircraft-scan\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eIf \u003ccode\u003ewhich python3\u003c/code\u003e is not on the PATH in the plist, either rely on \u003ccode\u003e.venv/bin/python\u003c/code\u003e (the shell script picks that up when \u003ccode\u003e.venv\u003c/code\u003e exists) or put that python\u0026#x27;s directory first in the PATH string. Chrome and the Playwright browsers must be installed for the same user that owns the LaunchAgent.\u003c/p\u003e\n\u003ch2\u003eAdd a new airplane tab\u003c/h2\u003e\n\u003cp\u003eUse the CubCrafters search as the pattern. A new family string (for example \u003ccode\u003epc12\u003c/code\u003e) becomes a slug, a \u003ccode\u003esaved/\u0026lt;slug\u0026gt;/\u003c/code\u003e folder, and a tab. Do not guess specs the listing does not state.\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003eRecognize the airplane\u003c/strong\u003e in \u003ccode\u003elistings.py\u003c/code\u003e. \u003ccode\u003eapply_listing\u003c/code\u003e sets \u003ccode\u003efamily\u003c/code\u003e from the title, model, and description. Add a detector that matches the make and model names you care about and rejects lookalikes (the CubCrafters path rejects Piper Super Cub, J-3, and American Legend). Put the stated marketing name in \u003ccode\u003emodel\u003c/code\u003e and the stated subtype in \u003ccode\u003evariant\u003c/code\u003e. Leave generation, engine, and gear blank unless the text states them.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eTeach each source\u003c/strong\u003e in \u003ccode\u003escrape_sources.py\u003c/code\u003e.\u003c/li\u003e\u003c/ol\u003e\n\u003cp\u003e- Cirrus models: add ids to \u003ccode\u003eCIRRUS_MODELS\u003c/code\u003e only if Cirrus\u0026#x27;s own feed has that model. - Another factory inventory page: add a scraper and call it from \u003ccode\u003esources_for\u003c/code\u003e the way \u003ccode\u003escrape_cubcrafters\u003c/code\u003e is called for the \u003ccode\u003ecubcrafters\u003c/code\u003e family. - ASO: add model ids to \u003ccode\u003eASO_MODELS\u003c/code\u003e, or text queries like \u003ccode\u003eASO_CUB_QUERIES\u003c/code\u003e, and keep the row only when \u003ccode\u003efamily\u003c/code\u003e matches. - GlobalAir: add a manufacturer URL to \u003ccode\u003eGLOBALAIR_PAGES\u003c/code\u003e. - AircraftDealer: add a category URL to \u003ccode\u003eDEALER_CATEGORIES\u003c/code\u003e and, if needed, search phrases. - Barnstormers: add search URLs and extend \u003ccode\u003e_title_matches_families\u003c/code\u003e so other makers are dropped. - Blocked sites: add a URL list to \u003ccode\u003eBLOCKED_BY_FAMILY\u003c/code\u003e. They are still attempted.\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003eRegister the search\u003c/strong\u003e in \u003ccode\u003erefresh_searches.py\u003c/code\u003e:\u003c/li\u003e\u003c/ol\u003e\n\u003cpre\u003e\u003ccode\u003e{\u0026quot;slug\u0026quot;: \u0026quot;pc12\u0026quot;, \u0026quot;title\u0026quot;: \u0026quot;Pilatus PC-12\u0026quot;, \u0026quot;families\u0026quot;: (\u0026quot;pc12\u0026quot;,)},\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003e\u003ccode\u003egenerate_report.py\u003c/code\u003e reads \u003ccode\u003eSEARCHES\u003c/code\u003e, so the new tab is included on the next build. The README tab stays last.\u003c/p\u003e\n\u003col\u003e\u003cli\u003e\u003cstrong\u003eNew source file name.\u003c/strong\u003e If you add a source key that is not already in \u003ccode\u003esaved_store.py\u003c/code\u003e \u003ccode\u003eSOURCE_FILES\u003c/code\u003e (the existing keys are \u003ccode\u003ecirrus\u003c/code\u003e, \u003ccode\u003ecubcrafters\u003c/code\u003e, \u003ccode\u003easo\u003c/code\u003e, \u003ccode\u003eglobalair\u003c/code\u003e, \u003ccode\u003eaircraftdealer\u003c/code\u003e, \u003ccode\u003ebarnstormers\u003c/code\u003e, \u003ccode\u003econtroller\u003c/code\u003e, \u003ccode\u003etradeaplane\u003c/code\u003e, \u003ccode\u003eaircraftcom\u003c/code\u003e, \u003ccode\u003eaerotrader\u003c/code\u003e, \u003ccode\u003eebay\u003c/code\u003e, \u003ccode\u003emerged\u003c/code\u003e), add a CSV name there. Add a label in \u003ccode\u003egenerate_report.py\u003c/code\u003e \u003ccode\u003eSITE_LABELS\u003c/code\u003e so the Source column shows a readable name.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eOptional filter chips\u003c/strong\u003e in \u003ccode\u003ereport_template.html\u003c/code\u003e \u003ccode\u003eSPEC_TERMS\u003c/code\u003e. A chip with \u003ccode\u003edisplay: true\u003c/code\u003e is a filter only. It appears on a tab only when at least one listing matches. Put related names in one \u003ccode\u003egroup\u003c/code\u003e so selecting several of them means \u0026quot;any of these\u0026quot;.\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eTests\u003c/strong\u003e in \u003ccode\u003etest_listings.py\u003c/code\u003e (a kept row, a rejected lookalike, and a parser fixture) and \u003ccode\u003etest_saved.py\u003c/code\u003e (a snapshot for the new slug does not write \u003ccode\u003esaved/sr22/\u003c/code\u003e).\u003c/li\u003e\u003cli\u003e\u003cstrong\u003eScrape and rebuild:\u003c/strong\u003e\u003c/li\u003e\u003c/ol\u003e\n\u003cpre\u003e\u003ccode\u003epython3 -m unittest test_listings.py test_saved.py\npython3 refresh_searches.py --slug pc12\npython3 generate_report.py\u003c/code\u003e\u003c/pre\u003e\n\u003col\u003e\u003cli\u003eAdd the new tab to the \u0026quot;This snapshot\u0026quot; section of this README and rebuild the HTML so the README tab matches.\u003c/li\u003e\u003c/ol\u003e\n\u003ch2\u003eData sources\u003c/h2\u003e\n\u003cp\u003eThese returned listings on the 2026-10-28 scrape, plus the PA-28-180/181 scrape on 2026-10-29.\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSource\u003c/th\u003e\u003cth\u003eSR22 raw\u003c/th\u003e\u003cth\u003eVision Jet raw\u003c/th\u003e\u003cth\u003eCubCrafters raw\u003c/th\u003e\u003cth\u003ePA-28-180/181 raw\u003c/th\u003e\u003cth\u003eHow it is read\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eCirrus approved pre-owned\u003c/td\u003e\u003ctd\u003e297\u003c/td\u003e\u003ctd\u003e31\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecirrusaircraft.com\u003c/code\u003e aircraft-listings JSON\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eCubCrafters inventory\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e17\u003c/td\u003e\u003ctd\u003e\u003c/td\u003e\u003ctd\u003e\u003ccode\u003ecubcrafters.com/c/inventory/\u003c/code\u003e. Sold ads and Piper ads dropped\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eASO\u003c/td\u003e\u003ctd\u003e308\u003c/td\u003e\u003ctd\u003e20\u003c/td\u003e\u003ctd\u003e11\u003c/td\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e\u003ccode\u003easo.com\u003c/code\u003e marketplace JSON. Cirrus uses model ids. CubCrafters and PA-28 use text queries, then a title/model filter. Every result page is read\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eGlobalAir\u003c/td\u003e\u003ctd\u003e265\u003c/td\u003e\u003ctd\u003e13\u003c/td\u003e\u003ctd\u003e14\u003c/td\u003e\u003ctd\u003e9\u003c/td\u003e\u003ctd\u003eManufacturer page in the browser, followed until there is no next page. PA-28 uses the Piper page and keeps only 180/181 titles\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAircraftDealer.com\u003c/td\u003e\u003ctd\u003e138\u003c/td\u003e\u003ctd\u003e7\u003c/td\u003e\u003ctd\u003e5\u003c/td\u003e\u003ctd\u003e9\u003c/td\u003e\u003ctd\u003eCategory pages in the browser, then the detail page when N-number or total time is missing. PA-28 uses the Archer and Cherokee 180 categories plus text search. This is not Aerotrader\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eBarnstormers\u003c/td\u003e\u003ctd\u003e8\u003c/td\u003e\u003ctd\u003e0\u003c/td\u003e\u003ctd\u003e11\u003c/td\u003e\u003ctd\u003e15\u003c/td\u003e\u003ctd\u003eAdvanced search. Parts, ferry, and service ads are dropped. The Vision Jet search had no whole-airplane ads\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003cp\u003eMerged counts in that snapshot:\u003c/p\u003e\n\u003cul\u003e\u003cli\u003eSR22 tab, data as of 2026-10-28 10:49 CDT: \u003cstrong\u003e414\u003c/strong\u003e airplanes (327 SR22-family, 87 SR20). \u003cstrong\u003e395\u003c/strong\u003e have an N-number. \u003cstrong\u003e260\u003c/strong\u003e are on more than one site. Asks run up to about $1.7 million.\u003c/li\u003e\u003cli\u003eVision Jet tab, data as of 2026-10-28 16:46 CDT: \u003cstrong\u003e39\u003c/strong\u003e SF50s. Generations the listings stated: 3 G1, 13 G2, 22 G2+, 5 Arrivee, 3 Premium, and 1 with no generation written down. No listing stated G3 or G3+. \u003cstrong\u003e38\u003c/strong\u003e have an N-number. \u003cstrong\u003e17\u003c/strong\u003e are on more than one site. Asks run to about $2.75 million. One listing stated engine cycles. Landings and a Cirrus Jet Support date were not stated.\u003c/li\u003e\u003cli\u003eCubCrafters tab, data as of 2026-10-28 18:17 CDT: \u003cstrong\u003e45\u003c/strong\u003e rows after N-number dedupe. \u003cstrong\u003e32\u003c/strong\u003e have an N-number. A 2016 Carbon Cub SS at $249,000 and a 2021 Carbon Cub EX-2 at $140,000 are each posted on AircraftDealer and Barnstormers with no registration, so each pair stays as two rows. Lines named in the ads: 28 Carbon Cub (11 SS, 7 FX-3, 5 EX-2, 3 EX-3, 1 EX, 1 FX-2), 7 NXCub, 6 XCub, 3 Sport Cub (2 of them S2), 1 Top Cub. Asks run from about $134,500 to $495,000.\u003c/li\u003e\u003cli\u003ePiper PA-28-180/181 tab, data as of 2026-10-29 13:01 CDT: \u003cstrong\u003e32\u003c/strong\u003e airplanes. \u003cstrong\u003e22\u003c/strong\u003e have an N-number. \u003cstrong\u003e8\u003c/strong\u003e are on more than one site. Stated models: 11 PA-28-180, 9 Cherokee 180, 2 Cherokee 180D, 1 Cherokee 180C, 1 Cherokee 180 Challenger, 5 PA-28-181 (2 Pilot 100i, plus Archer II, Archer III, and Archer LX), 2 Archer, 1 Archer II, and 1 Archer III. Warriors, Arrows, Dakotas, Cruisers, and a Cherokee 140 with a 180 hp conversion were excluded. Asks run from about $49,900 to $539,900. Sixteen rows state an engine-time figure such as SMOH.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThese five sites blocked automated access. They are still attempted on every refresh. A failure does not erase a previous file, and no rows were invented for them:\u003c/p\u003e\n\u003ctable\u003e\u003cthead\u003e\u003ctr\u003e\u003cth\u003eSite\u003c/th\u003e\u003cth\u003eWhat happened\u003c/th\u003e\u003c/tr\u003e\u003c/thead\u003e\u003ctbody\u003e\u003ctr\u003e\u003ctd\u003eController.com\u003c/td\u003e\u003ctd\u003eCloudflare challenge (\u0026quot;Just a moment...\u0026quot;)\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eTrade-A-Plane\u003c/td\u003e\u003ctd\u003eThe request was blocked before any search results\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAircraft.com\u003c/td\u003e\u003ctd\u003eCloudflare challenge\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eAerotrader\u003c/td\u003e\u003ctd\u003eThe request was blocked before any listings. AircraftDealer.com is a different site and is scraped\u003c/td\u003e\u003c/tr\u003e\u003ctr\u003e\u003ctd\u003eeBay Motors\u003c/td\u003e\u003ctd\u003eRobot block\u003c/td\u003e\u003c/tr\u003e\u003c/tbody\u003e\u003c/table\u003e\n\u003ch3\u003eKnown gaps\u003c/h3\u003e\n\u003cp\u003eA cell stays blank when the listing does not state the value. Nothing is estimated. A 2004 SR22 is not labeled G2 unless the listing says G2. \u0026quot;Less than 100 TT\u0026quot; is not stored as 100. A type code such as CCX-2300 is not renamed to XCub or NXCub unless the listing says which one. Bushwheels are not relabeled as tundra tires.\u003c/p\u003e\n\u003cp\u003eOften blank because the page does not say: engine time-to-TBO, propeller time, interior and exterior colors, airport identifier, days on market, and a dollar amount for a price drop. GlobalAir and Barnstormers cards are used as published, so engine time on those rows is blank unless the card states it. ASO\u0026#x27;s result feed states total time, registration, serial, price, seller, and the published date, and does not state engine time or CAPS. \u0026quot;Call for price\u0026quot; is blank. A non-USD ask is kept in that currency and is not converted. Two different N-numbers are never merged. An airplane with no N-number and no serial stays its own row, so the same ad on two sites can appear twice.\u003c/p\u003e\n\u003cp\u003eMarket value, BaT, and MSRP columns are on the page so the layout matches the car report. There is no sold-auction feed and no stated MSRP for these airplanes, so those cells are empty.\u003c/p\u003e\n\u003ch2\u003eShare the report\u003c/h2\u003e\n\u003cp\u003e\u003ccode\u003eoutput/report.html\u003c/code\u003e is one file. The listings, the four tabs, and this README are inside it. Airplanes, filters, sorting, and the price chart work with the file open from disk and no local server. The server is only for background refresh and the UPDATE button.\u003c/p\u003e\n\u003cp\u003eSend that file, or commit it and have the other person open the same path in their clone. Fonts and the chart library load from the network (Google Fonts and jsDelivr). With no network the tables still show; the chart does not.\u003c/p\u003e\n\u003cp\u003eThe README tab is a copy of this file at the moment \u003ccode\u003egenerate_report.py\u003c/code\u003e or a scraping refresh last ran. Edit \u003ccode\u003eREADME.md\u003c/code\u003e, then run \u003ccode\u003epython3 generate_report.py\u003c/code\u003e, or the tab and the markdown file will differ.\u003c/p\u003e\n\u003ch2\u003eTroubleshooting\u003c/h2\u003e\n\u003cp\u003e\u003cstrong\u003eA source shows a warning and no new rows.\u003c/strong\u003e Controller, Trade-A-Plane, Aircraft.com, Aerotrader, and eBay usually fail. The tab warning and \u003ccode\u003esaved/\u0026lt;slug\u0026gt;/meta.json\u003c/code\u003e name the reason. Rows from the last good CSV for that source stay. The other sources still update. You do not need to do anything for a blocked site.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eA refresh returned no listings.\u003c/strong\u003e If that source already had a real snapshot, the empty result is rejected and the old CSV stays. If this is the first run and the source has no file, \u003ccode\u003emeta.json\u003c/code\u003e says there are no saved listings. Read the warning. Do not delete \u003ccode\u003esaved/\u0026lt;slug\u0026gt;/\u003c/code\u003e to \u0026quot;start clean\u0026quot; unless you mean to lose the last good snapshot.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe page looks old.\u003c/strong\u003e Check \u003cstrong\u003eData as of\u003c/strong\u003e on the tab. If it is inside the freshness window, \u003ccode\u003epython3 refresh_searches.py\u003c/code\u003e will skip it. Use \u003ccode\u003e--force\u003c/code\u003e or the UPDATE button (server must be running: \u003ccode\u003epython3 search_server.py\u003c/code\u003e, then \u003ccode\u003ehttp://127.0.0.1:8766\u003c/code\u003e). Opening the HTML file never scrapes.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eUPDATE does nothing or says the server is not running.\u003c/strong\u003e The button only works on \u003ccode\u003ehttp://127.0.0.1:8766\u003c/code\u003e, not on a \u003ccode\u003efile://\u003c/code\u003e URL. Start \u003ccode\u003epython3 search_server.py\u003c/code\u003e from this folder with the virtualenv active, and leave it running.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eChrome or Chromium was not found.\u003c/strong\u003e From this folder, with the virtualenv active:\u003c/p\u003e\n\u003cpre\u003e\u003ccode\u003epython3 -m playwright install chromium\u003c/code\u003e\u003c/pre\u003e\n\u003cp\u003eInstall Google Chrome as well. The next refresh tries Chromium, then Chrome. If both fail, the message is \u003ccode\u003ecould not launch a browser\u003c/code\u003e. The tests do not need a browser.\u003c/p\u003e\n\u003cp\u003e**\u003ccode\u003epython3 -m venv .venv\u003c/code\u003e fails, or \u003ccode\u003epython3\u003c/code\u003e is the wrong version.** \u003ccode\u003epython3 --version\u003c/code\u003e should be 3.11 or newer. Use the python.org installer or \u003ccode\u003ebrew install python@3.12\u003c/code\u003e if venv reports that ensurepip is missing. The weekly script uses \u003ccode\u003e.venv/bin/python\u003c/code\u003e when \u003ccode\u003e.venv\u003c/code\u003e is in this folder, which is what the first-run steps create. Recreate it with \u003ccode\u003epython3 -m venv .venv\u003c/code\u003e if the folder was moved.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eThe README tab is missing or stale.\u003c/strong\u003e Run \u003ccode\u003epython3 generate_report.py\u003c/code\u003e. A skipped refresh does not rebuild the HTML.\u003c/p\u003e", "url": "", "bat": [], "autotrader_url": ""}];
const SEARCH_API = "http://127.0.0.1:8766";
const DEFAULT_ZIP = "";
const NOW_MS = 1793297647231;
const FRESH_DAYS = 2;

const DEAL_RANK = { fair: 1, good: 2, great: 3 };

// Same column order as the car tabs. `mileage` holds total time and `vin` holds the N-number,
// so this tab can be dropped into the car report later. UNITS is the only wording swap.
const UNITS = {
  usageLabel: 'Hours',
  usageSuffix: 'hr',
  usageAxis: 'Total time (hr)',
  usagePer: 100,
  usagePerLabel: 'Each 100 hours',
  zoomStep: 50,
  idLabel: 'N-number',
  noun: 'airplane',
  outlookPerYear: 100,
};
const COLS = [
  { key: 'score', label: 'Match', live: true },
  { key: 'year', label: 'Year' },
  { key: 'title', label: 'Title' },
  { key: 'price', label: 'Price', r: true, tip: 'Asking price. When the same airplane is listed on more than one site, this is the lowest price.' },
  { key: 'expected', label: 'Market value', r: true, tip: 'What this airplane should ask, from same-year listings adjusted for total time and specs' },
  { key: 'vs_market', label: 'Vs market', r: true },
  { key: 'bat_value', label: 'BaT value', r: true, tip: 'No sold-auction overlay for this search' },
  { key: 'pct_msrp', label: 'MSRP (stated)', r: true },
  { key: 'mileage', label: 'Hours', r: true, tip: 'Total time (TTAF), in hours. Nothing is converted from mileage.' },
  { key: 'color', label: 'Color' },
  { key: 'posted_date', label: 'Posted' },
  { key: 'city', label: 'Location' },
  { key: 'dealer', label: 'Dealer' },
  { key: 'site_code', label: 'Source' },
  { key: 'vin', label: 'N-number' },
  { key: null, label: 'Link' },
];

// ---------- helpers ----------
function fmtPrice(p) { return p == null ? 'N/A' : '$' + p.toLocaleString(); }
function sourceLabel(s) {
  let label = s.site || 'listing';
  if (s.price != null) label += ' ' + fmtPrice(s.price);
  if (s.price_with_fees != null && s.price_with_fees !== s.price) label += ' (' + fmtPrice(s.price_with_fees) + ' w/ fees)';
  return label;
}
function priceCell(d) {
  let html = `<b>${fmtPrice(d.price)}</b>`;
  const sources = d.sources || [];
  if (sources.length > 1) {
    const nums = sources.map(s => s.price).filter(v => v != null);
    if (new Set(nums).size > 1) html += `<small>${sources.length} sites</small>`;
  } else {
    const fees = sources.map(s => s.price_with_fees).filter(v => v != null && v !== d.price);
    if (fees.length) html += `<small>${fmtPrice(fees[0])} with fees</small>`;
  }
  return html;
}
function extraNote(d) {
  if ((d.sources || []).length > 1 || !d.extra_sites) return '';
  return ` <span class="muted" title="Also listed on other sites">${escapeHtml(d.extra_sites)}</span>`;
}
function sourceCell(d) {
  const sources = d.sources || [];
  if (sources.length > 1) {
    return sources.map(s => {
      const link = safeUrl(s.link);
      const label = escapeHtml(sourceLabel(s));
      return link ? `<a class="view-link" href="${escapeHtml(link)}" target="_blank" rel="noopener">${label}</a>` : label;
    }).join(' ');
  }
  return escapeHtml(d.site_code) + extraNote(d);
}
function fmtMiles(m) { return m == null ? 'N/A' : m.toLocaleString() + ' ' + UNITS.usageSuffix; }
function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function safeUrl(u) { return /^https?:\/\//i.test(u || '') ? u : ''; }
function dealBadge(rating) {
  return DEAL_RANK[rating] ? `<span class="badge ${rating}">${rating}</span>` : '';
}
function debounce(fn, ms) {
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function numOrNull(v) {
  if (v == null) return null;
  const s = String(v).replace(/[$,\s]/g, '');
  if (s === '') return null;
  const n = Number(s);
  return Number.isFinite(n) ? n : null;
}
function colorForYear(i, n) {
  const hue = n <= 1 ? 200 : Math.round(220 - (i / (n - 1)) * 220);
  return `hsl(${hue}, 70%, 60%)`;
}

// ---------- fuzzy matching ----------
function wordsOf(s) { return (s || '').toLowerCase().match(/[a-z0-9]+/g) || []; }

function editDistance(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      const v = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost);
      cur.push(v);
      if (v < rowMin) rowMin = v;
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}

// 0 = no match, 1 = typo-tolerant, 2 = substring, 3 = whole word
function matchStrength(text, words, token) {
  if (!token) return 0;
  if (words.includes(token)) return 3;
  if (text.includes(token)) return 2;
  if (token.length >= 5) {
    for (const w of words) if (editDistance(w, token, 1) <= 1) return 1;
  }
  return 0;
}

// Listing cards carry no color field, so infer exterior color from title/description text.
const COLOR_WORDS = [
  ['Black', /\b(black|nero|noir|obsidian|onyx|ebony|schwarz)\b/],
  ['White', /\b(white|bianco|blanc|polar|diamond white|glacier)\b/],
  ['Gray', /\b(gr[ae]y|grigio|graphite|gunmetal|selenite|magno|chalk|crayon|nardo|charcoal|slate|tungsten)\b/],
  ['Silver', /\b(silver|argento|iridium|platinum silver)\b/],
  ['Red', /\b(red|rosso|rouge|burgundy|maroon|crimson|tango)\b/],
  ['Blue', /\b(blue|blu|azzurro|navy|cobalt|sepang|ascari|kyanite)\b/],
  ['Green', /\b(green|verde|olive|emerald|british racing|sage)\b/],
  ['Yellow', /\b(yellow|giallo|amarillo)\b/],
  ['Orange', /\b(orange|arancio|arancione)\b/],
  ['Brown/Tan', /\b(brown|bronze|beige|tan|marrone|copper|desert sand)\b/],
  ['Gold', /\b(gold|oro|champagne)\b/],
  ['Purple', /\b(purple|viola|violet)\b/],
];

function detectColor(row) {
  const text = ((row.title || '') + ' ' + (row.description || '')).toLowerCase();
  let best = null, bestAt = Infinity;
  for (const [name, re] of COLOR_WORDS) {
    const m = text.match(re);
    if (m && m.index < bestAt) { best = name; bestAt = m.index; }
  }
  return best || 'Unknown';
}

function prepRow(row) {
  row.color = detectColor(row);
  row._specs = detectSpecs(row);
  row.pct_msrp = row.msrp && row.price != null ? Math.round((row.price / row.msrp - 1) * 1000) / 10 : null;
  row._title = (row.title || '').toLowerCase();
  row._titleWords = wordsOf(row.title);
  row._text = [row.title, row.dealer, row.city, row.description, row.site_code, row.vin || '', row.year].join(' ').toLowerCase();
  row._words = wordsOf(row._text);
  return row;
}

// Multi-word alternatives ("911 turbo") match when every word is present, in any order.
function altStrength(text, words, alt) {
  const parts = alt.split(/\s+/).filter(Boolean);
  if (parts.length <= 1) return matchStrength(text, words, alt);
  let min = 3;
  for (const p of parts) {
    const s = matchStrength(text, words, p);
    if (!s) return 0;
    if (s < min) min = s;
  }
  return min;
}

function scoreRow(row, tokens, alts) {
  if (!tokens.length) return null;
  let total = 0;
  for (const t of tokens) {
    let best = 0;
    for (const alt of (alts[t] || [t])) {
      const inTitle = altStrength(row._title, row._titleWords, alt);
      const inText = altStrength(row._text, row._words, alt) * 0.6;
      best = Math.max(best, inTitle, inText);
    }
    total += best;
  }
  return Math.round((total / (3 * tokens.length)) * 100);
}

// ---------- market model ----------
// Per-tab hedonic regression: log(price) ~ model year + miles + older-generation flag + spec keywords.
// Fit by least squares, refit after dropping listings priced far off the line (bad data, salvage, etc.).
// [name, regex, options]. title: match the title only (trim names also show up in
// descriptions as "limited warranty", "luxury SUV"...). display: a filter chip only, kept
// out of the market model. group: chips in one group are alternatives (any of them);
// different groups and ungrouped chips must all match.
const SPEC_TERMS = [
  ['GTS', /\bgts\b/i, { title: true, display: true, group: 'trim' }],
  ['Turbo', /\bsr22t\b|\bturbo\b/i, { title: true, display: true, group: 'engine' }],
  ['Arrivee', /\barriv[eé]e\b/i, { title: true, display: true }],
  ['G3+', /\bg3\s*\+/i, { title: true, display: true, group: 'gen' }],
  ['G2+', /\bg2\s*\+/i, { title: true, display: true, group: 'gen' }],
  ['G7+', /\bg7\s*\+/i, { title: true, display: true, group: 'gen' }],
  ['G7', /\bg7\b/i, { title: true, display: true, group: 'gen' }],
  ['G6', /\bg6\b/i, { title: true, display: true, group: 'gen' }],
  ['G5', /\bg5\b/i, { title: true, display: true, group: 'gen' }],
  ['G3', /\bg3\b/i, { title: true, display: true, group: 'gen' }],
  ['G2', /\bg2\b/i, { title: true, display: true, group: 'gen' }],
  ['G1', /\bg1\b/i, { title: true, display: true, group: 'gen' }],
  ['Carbon Cub', /\bcarbon cub\b/i, { display: true, group: 'line' }],
  ['FX-3', /\bfx-?\s*3\b/i, { display: true, group: 'line' }],
  ['FX-2', /\bfx-?\s*2\b/i, { display: true, group: 'line' }],
  ['EX-3', /\bex-?\s*3\b/i, { display: true, group: 'line' }],
  ['EX-2', /\bex-?\s*2\b/i, { display: true, group: 'line' }],
  ['XCub', /\bx-?\s*cub\b/i, { display: true, group: 'line' }],
  ['NXCub', /\bnx-?\s*cub\b/i, { display: true, group: 'line' }],
  ['Top Cub', /\btop cub\b/i, { display: true, group: 'line' }],
  ['Sport Cub', /\bsport cub\b/i, { display: true, group: 'line' }],
  ['PA-28-181', /\bpa\s*-?\s*28\s*-?\s*181\b/i, { display: true, group: 'line' }],
  ['PA-28-180', /\bpa\s*-?\s*28\s*-?\s*180(?:\s*[a-g])?\b/i, { display: true, group: 'line' }],
  ['Archer LX', /\barcher\s+lx\b/i, { display: true, group: 'line' }],
  ['Archer DX', /\barcher\s+dx\b/i, { display: true, group: 'line' }],
  ['Archer III', /\barcher\s+iii\b/i, { display: true, group: 'line' }],
  ['Archer II', /\barcher\s+ii(?!i)\b/i, { display: true, group: 'line' }],
  ['Archer', /\barcher\b/i, { display: true, group: 'line' }],
  ['Cherokee 180', /\bcher(?:okee)?\s+180/i, { display: true, group: 'line' }],
  ['Challenger', /\bchallenger\b/i, { display: true, group: 'line' }],
  ['Pilot 100i', /\bpilot\s+100i\b/i, { display: true, group: 'line' }],
  ['FIKI', /\bfiki\b|known icing/i],
  ['TKS', /\btks\b/i],
  ['A/C', /\ba\/c\b|air conditioning/i],
  ['Perspective+', /perspective\s*\+/i],
  ['Perspective', /\bperspective\b/i],
  ['Avidyne', /\bavidyne\b/i],
  ['ADS-B', /ads-?b/i],
  ['Floats', /\bfloats?\b|\bamphib/i, { display: true, group: 'gear' }],
  ['Tundra', /\btundra\b|\bbush\s*-?\s*wheels?\b/i, { display: true, group: 'gear' }],
  ['Skis', /\bskis\b/i, { display: true, group: 'gear' }],
];
const MIN_SPEC_COUNT = 4;

const SPEC_GROUP = Object.fromEntries(SPEC_TERMS.map(([name, , o]) => [name, (o && o.group) || name]));

function detectSpecs(row) {
  const title = (row.title || '').toLowerCase();
  const text = title + ' ' + (row.description || '').toLowerCase();
  return SPEC_TERMS.filter(([, re, o]) => re.test(o && o.title ? title : text)).map(([name]) => name);
}

function solveLinear(A, b) {
  const n = b.length, M = A.map((r, i) => [...r, b[i]]);
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
    if (Math.abs(M[p][c]) < 1e-12) return null;
    [M[c], M[p]] = [M[p], M[c]];
    for (let r = 0; r < n; r++) {
      if (r === c) continue;
      const k = M[r][c] / M[c][c];
      for (let j = c; j <= n; j++) M[r][j] -= k * M[c][j];
    }
  }
  return M.map((r, i) => r[n] / r[i]);
}

function ols(X, y) {
  const p = X[0].length;
  const XtX = Array.from({ length: p }, (_, i) => Array.from({ length: p }, (_, j) => X.reduce((s, r) => s + r[i] * r[j], 0)));
  const Xty = Array.from({ length: p }, (_, i) => X.reduce((s, r, k) => s + r[i] * y[k], 0));
  const beta = solveLinear(XtX, Xty);
  if (!beta) return null;
  const inv = Array.from({ length: p }, (_, i) => solveLinear(XtX, Array.from({ length: p }, (_, j) => +(i === j))));
  if (inv.some(c => !c)) return null;
  const resid = y.map((v, k) => v - X[k].reduce((s, x, j) => s + x * beta[j], 0));
  const s2 = resid.reduce((s, r) => s + r * r, 0) / Math.max(1, y.length - p);
  return { beta, resid, se: beta.map((_, j) => Math.sqrt(s2 * inv[j][j])) };
}

function quantile(sorted, q) {
  const i = (sorted.length - 1) * q, lo = Math.floor(i), hi = Math.ceil(i);
  return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo);
}

const MIN_YEAR_COUNT = 3;

function buildModel(rows) {
  const priced = rows.filter(r => r.price != null && r.mileage != null && r.year != null);
  if (priced.length < 15) return null;

  // Only compare within the current generation: a big gap in model years (e.g. 2003 vs 2021+ RS6)
  // means the older cars are a different car, so they are left out entirely.
  const allYears = [...new Set(priced.map(r => r.year))].sort((a, b) => a - b);
  let genCut = null;
  for (let i = 1; i < allYears.length; i++) if (allYears[i] - allYears[i - 1] >= 5) genCut = allYears[i - 1];
  const current = priced.filter(r => genCut == null || r.year > genCut);

  // Each model year is its own group, so a car is only valued against same-year listings.
  const yearCounts = {};
  current.forEach(r => { yearCounts[r.year] = (yearCounts[r.year] || 0) + 1; });
  const years = Object.keys(yearCounts).map(Number).filter(y => yearCounts[y] >= MIN_YEAR_COUNT).sort((a, b) => a - b);
  const thinYears = Object.keys(yearCounts).map(Number).filter(y => yearCounts[y] < MIN_YEAR_COUNT).sort((a, b) => a - b);
  const data = current.filter(r => years.includes(r.year));
  if (data.length < 15) return null;
  const baseYear = years.reduce((a, y) => (yearCounts[y] > yearCounts[a] ? y : a), years[0]);

  const specs = SPEC_TERMS.filter(([, , o]) => !(o && o.display)).map(([name]) => name).filter(name => {
    const n = data.filter(r => r._specs.includes(name)).length;
    return n >= MIN_SPEC_COUNT && n <= data.length - MIN_SPEC_COUNT;
  });

  const terms = [{ key: 'const', f: () => 1 }];
  years.filter(y => y !== baseYear).forEach(y => terms.push({ key: 'year', year: y, f: r => +(r.year === y) }));
  terms.push({ key: 'miles', label: UNITS.usagePerLabel, f: r => r.mileage / UNITS.usagePer });
  specs.forEach(name => terms.push({ key: 'spec', label: name, spec: name, f: r => +r._specs.includes(name) }));

  const design = r => terms.map(t => t.f(r));
  const logFit = (r, beta) => design(r).reduce((s, x, j) => s + x * beta[j], 0);
  let fitRows = data, fit = null, outliers = new Set();
  for (let pass = 0; pass < 3; pass++) {
    if (fitRows.length < terms.length + 8) return null;
    fit = ols(fitRows.map(design), fitRows.map(r => Math.log(r.price)));
    if (!fit) return null;
    const absRes = fit.resid.map(Math.abs).sort((a, b) => a - b);
    const cutoff = Math.max(3 * 1.4826 * quantile(absRes, 0.5), 0.2);
    const next = new Set(data.filter(r => Math.abs(Math.log(r.price) - logFit(r, fit.beta)) > cutoff));
    if (next.size === outliers.size && [...next].every(r => outliers.has(r))) break;
    outliers = next;
    fitRows = data.filter(r => !outliers.has(r));
  }

  const y = fitRows.map(r => Math.log(r.price));
  const yBar = y.reduce((s, v) => s + v, 0) / y.length;
  const ssTot = y.reduce((s, v) => s + (v - yBar) ** 2, 0);
  const ssRes = fit.resid.reduce((s, v) => s + v * v, 0);
  const res = [...fit.resid].sort((a, b) => a - b);
  const sortedBy = (list, f) => list.map(f).sort((a, b) => a - b);

  const byYear = years.map(yr => {
    const list = fitRows.filter(r => r.year === yr);
    const prices = sortedBy(list, r => r.price), miles = sortedBy(list, r => r.mileage);
    return {
      year: yr, n: list.length,
      medPrice: quantile(prices, 0.5), lo: quantile(prices, 0.1), hi: quantile(prices, 0.9),
      medMiles: quantile(miles, 0.5),
    };
  });

  return {
    terms, beta: fit.beta, se: fit.se, genCut, specs, years, thinYears, yearCounts, outliers, byYear,
    n: fitRows.length, r2: ssTot ? 1 - ssRes / ssTot : 0,
    typicalPrice: quantile(sortedBy(fitRows, r => r.price), 0.5),
    medianMiles: quantile(sortedBy(fitRows, r => r.mileage), 0.5),
    resLo: quantile(res, 0.1), resHi: quantile(res, 0.9),
    spread: quantile(res.map(Math.abs).sort((a, b) => a - b), 0.5),
    covers: r => r.year != null && years.includes(r.year),
    predict: r => Math.exp(logFit(r, fit.beta)),
  };
}

function applyModel(tab) {
  const m = tab._model = buildModel(tab.rows);
  tab.rows.forEach(r => {
    r.expected = null; r.vs_market = null; r._outlier = false; r._skip = '';
    if (!m || r.year == null || r.mileage == null) return;
    if (m.genCut != null && r.year <= m.genCut) { r._skip = 'older generation'; return; }
    if (!m.covers(r)) { r._skip = 'too few comps'; return; }
    r.expected = Math.round(m.predict(r) / 100) * 100;
    if (r.price != null) {
      r.vs_market = Math.round((r.price / r.expected - 1) * 1000) / 10;
      r._outlier = m.outliers.has(r);
    }
  });
}

function fmtPct(v, digits = 0) {
  const mag = Math.abs(v).toFixed(digits);
  if (Number(mag) === 0) return (0).toFixed(digits) + '%';
  return (v > 0 ? '+' : '−') + mag + '%';
}
function fmtDollarDelta(v) {
  return (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + Math.abs(Math.round(v / 100) * 100).toLocaleString();
}

function vsMarketCell(d) {
  if (d._skip) return `<span class="muted" title="Not compared: ${d._skip === 'older generation' ? 'different generation from the rest of this search' : 'fewer than ' + MIN_YEAR_COUNT + ' same-year listings'}">${d._skip}</span>`;
  if (d.vs_market == null) return '<span class="muted">–</span>';
  const cls = d.vs_market <= -5 ? 'below' : d.vs_market >= 5 ? 'above' : 'muted';
  return `<span class="${cls}">${fmtPct(d.vs_market)}</span>${d._outlier ? ' <span class="badge outlier" title="Too far from the model to trust; left out of the fit">check</span>' : ''}`;
}

// MSRP only appears when the listing itself states it (CarGurus page data or the description).
function msrpCell(d) {
  if (!d.msrp) return '<span class="muted">–</span>';
  const src = d.msrp_source === 'cargurus' ? 'Dealer-reported MSRP on CarGurus' : 'MSRP quoted in the listing description';
  const pct = d.pct_msrp != null ? ` <span class="${d.pct_msrp < 0 ? 'below' : 'muted'}">${fmtPct(d.pct_msrp)}</span>` : '';
  return `<span title="${src}">${fmtPrice(d.msrp)}</span>${pct}`;
}

function msrpSummary(rows) {
  const pcts = rows.filter(r => r.pct_msrp != null).map(r => r.pct_msrp).sort((a, b) => a - b);
  return pcts.length ? { n: pcts.length, med: quantile(pcts, 0.5) } : null;
}

function renderAnalysis(tab) {
  const box = tab._panel.querySelector('[data-role=analysis]');
  if (!box) return;
  const m = tab._model;
  if (!m) {
    box.innerHTML = `<h2>Market analysis</h2><p class="muted">Not enough listings with price, year and total time to model this market${tab.live ? ' yet' : ''}.</p>`;
    return;
  }

  const effectRows = m.terms.map((t, j) => ({ t, b: m.beta[j], se: m.se[j] })).filter(e => e.t.key === 'miles' || e.t.key === 'spec').map(({ t, b, se }) => {
    const pct = (Math.exp(b) - 1) * 100;
    const solid = Math.abs(b) > 2 * se;
    return `<tr>
      <td>${escapeHtml(t.label)}</td>
      <td class="${pct < 0 ? 'neg' : 'pos'}">${fmtPct(pct, 1)}</td>
      <td>${fmtDollarDelta(m.typicalPrice * pct / 100)}</td>
      <td>${solid ? '<span class="sure">clear</span>' : '<span class="muted">weak / unclear</span>'}</td>
    </tr>`;
  }).join('');

  const yearRows = m.byYear.map(b => {
    const exp = m.predict({ year: b.year, mileage: b.medMiles, _specs: [] });
    return `<tr>
      <td>${b.year}</td><td>${b.n}</td><td>${fmtPrice(Math.round(b.medPrice / 100) * 100)}</td>
      <td>${fmtPrice(Math.round(b.lo / 500) * 500)} – ${fmtPrice(Math.round(b.hi / 500) * 500)}</td>
      <td>${fmtMiles(Math.round(b.medMiles / 100) * 100)}</td>
      <td>${fmtPrice(Math.round(exp / 500) * 500)}</td>
      <td>${(ms => ms ? `${fmtPct(ms.med)} <span class="muted">(${ms.n})</span>` : '<span class="muted">–</span>')(msrpSummary(tab.rows.filter(r => r.year === b.year && !r._outlier)))}</td>
    </tr>`;
  }).join('');

  const left = [];
  if (m.genCut != null) left.push(`${tab.rows.filter(r => r.year != null && r.year <= m.genCut).length} older-generation airplanes (${m.genCut} and earlier)`);
  if (m.thinYears.length) left.push(`${m.thinYears.map(y => `${y} (${m.yearCounts[y]})`).join(', ')}: too few same-year listings`);
  if (m.outliers.size) left.push(`${m.outliers.size} priced far off their year's market, flagged <span class="badge outlier">check</span>`);

  const fitWord = m.r2 >= 0.7 ? 'explain most of' : m.r2 >= 0.4 ? 'explain a fair share of' : 'explain only a small part of';
  const yearOpts = m.years.map(y => `<option${y === m.years[m.years.length - 1] ? ' selected' : ''}>${y}</option>`).join('');
  const specBoxes = m.specs.map(s => `<label class="check"><input type="checkbox" data-calc-spec="${escapeHtml(s)}"> ${escapeHtml(s)}</label>`).join('');

  box.innerHTML = `
    <h2>Market analysis</h2>
    <p class="lede">Each airplane is compared only with <b>same-model-year</b> listings, adjusted for total time${m.specs.length ? ' and the specs below' : ''}. Built from <b>${m.n}</b> listings across ${m.years.join(', ')}.
      Year, total time${m.specs.length ? ' and specs' : ''} ${fitWord} the price differences (R² ${m.r2.toFixed(2)}); half of listings sit within <b>±${Math.round((Math.exp(m.spread) - 1) * 100)}%</b> of their expected price. The rest is options, condition, avionics and dealer pricing the listings don't show.</p>
    <p class="footnote">MSRP is shown only where the listing states it (${tab.rows.filter(r => r.msrp).length} of ${tab.rows.length} listings here). Nothing is estimated.</p>
    ${left.length ? `<p class="footnote">Left out of the comparison: ${left.join('; ')}.</p>` : ''}
    <div class="analysis-grid">
      <div>
        <h3>By model year</h3>
        <table class="effects">
          <thead><tr><th class="no-sort">Year</th><th class="no-sort">Listings</th><th class="no-sort">Median ask</th><th class="no-sort">Middle 80%</th><th class="no-sort">Median hours</th><th class="no-sort">Expected at median hours</th><th class="no-sort" title="Median asking price vs the MSRP stated on the listing; count in brackets">Ask vs MSRP</th></tr></thead>
          <tbody>${yearRows}</tbody>
        </table>
        <h3>What moves the price within a year</h3>
        <table class="effects">
          <thead><tr><th class="no-sort">Factor</th><th class="no-sort">Effect</th><th class="no-sort">On a ${fmtPrice(Math.round(m.typicalPrice / 1000) * 1000)} airplane</th><th class="no-sort">Signal</th></tr></thead>
          <tbody>${effectRows}</tbody>
        </table>
      </div>
      <div class="calc">
        <h3>What to expect</h3>
        <div class="filter-grid">
          <label>Year<select data-calc="year">${yearOpts}</select></label>
          <label>Hours<input data-calc="miles" inputmode="numeric"></label>
          <label>Hours / year after<input data-calc="perYear" inputmode="numeric" value="100"></label>
        </div>
        ${specBoxes ? `<div class="checks">${specBoxes}</div>` : ''}
        <div class="calc-out" data-role="calcOut"></div>
      </div>
    </div>
    <p class="footnote">How this works: a regression of log price on model year (as separate groups), total time${m.specs.length ? ' and spec keywords found in titles/descriptions' : ''}, re-fit after setting aside listings priced far from their year's market. "Vs market" is each airplane's asking price against what the model expects for its year, total time and specs. Each N-number is one airplane; when several sites list it, the price used here is the lowest ask.</p>`;

  // Miles follow the chosen year's typical mileage until the user types their own.
  const yearSel = box.querySelector('[data-calc=year]'), milesIn = box.querySelector('[data-calc=miles]');
  const syncMiles = () => {
    if (milesIn.dataset.touched) return;
    const b = m.byYear.find(b => b.year === Number(yearSel.value));
    milesIn.value = Math.round((b ? b.medMiles : m.medianMiles) / 10) * 10;
  };
  milesIn.addEventListener('input', () => { milesIn.dataset.touched = '1'; });
  yearSel.addEventListener('change', syncMiles);
  syncMiles();

  const update = () => updateCalc(tab);
  box.querySelectorAll('[data-calc], [data-calc-spec]').forEach(el => {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });
  update();
}

function updateCalc(tab) {
  const m = tab._model, box = tab._panel.querySelector('[data-role=analysis]');
  const year = Number(box.querySelector('[data-calc=year]').value);
  const miles = numOrNull(box.querySelector('[data-calc=miles]').value) ?? m.medianMiles;
  const perYear = numOrNull(box.querySelector('[data-calc=perYear]').value) ?? 0;
  const specs = [...box.querySelectorAll('[data-calc-spec]:checked')].map(el => el.dataset.calcSpec);
  const car = { year, mileage: miles, _specs: specs };

  const mid = m.predict(car);
  const lo = mid * Math.exp(m.resLo), hi = mid * Math.exp(m.resHi);
  const round = v => fmtPrice(Math.round(v / 500) * 500);

  // Next year this car is a year older: use today's price gap between this model year and the one before it.
  let outlook;
  if (m.years.includes(year - 1)) {
    const later = m.predict({ year: year - 1, mileage: miles + perYear, _specs: specs });
    outlook = `<div class="stat"><span>In 12 months (+${perYear.toLocaleString()} hr)</span><b>${round(later)}</b><em>${fmtPct((later / mid - 1) * 100, 1)} · rough, based on today's gap between ${year} and ${year - 1} airplanes</em></div>`;
  } else {
    outlook = `<div class="stat"><span>In 12 months</span><b class="muted">–</b><em>No ${year - 1} listings to compare with, so no projection.</em></div>`;
  }

  box.querySelector('[data-role=calcOut]').innerHTML = `
    <div class="stat"><span>Expected asking price</span><b>${round(mid)}</b></div>
    <div class="stat"><span>Typical range (middle 80%)</span><b>${round(lo)} – ${round(hi)}</b></div>
    <div class="stat"><span>Strong buy below</span><b class="pos">${round(lo)}</b><em>cheaper than 9 in 10 comparable listings</em></div>
    ${outlook}`;
}

// ---------- tab state / filtering ----------
function newState(live) {
  return {
    showBat: false,
    area: null,
    bat: { days: 730, text: '', country: '', stock: true, matchSearch: true, adjust: false },
    sortKey: live ? 'score' : 'price',
    sortDir: live ? -1 : 1,
    filters: { yearMin: null, yearMax: null, priceMin: null, priceMax: null, milesMin: null, milesMax: null, deal: '', color: '', vs: '', text: '', specs: [], sr20: false },
  };
}

function sortVal(row, key) {
  if (key === 'deal_rating') return DEAL_RANK[row.deal_rating] || null;
  const v = row[key];
  return v === '' ? null : v;
}

// ---------- BaT sold overlay ----------
const MODIFIED_RE = /\b(modified|tuned|renntech|weistec|capristo|brabus|mansory|novitec|stage [123]|aftermarket (turbo|supercharger|exhaust|tune)|built engine|widebody)\b/i;
const DAY_MS = 86400000;

function prepBatRow(row) {
  row._title = (row.title || '').toLowerCase();
  row._titleWords = wordsOf(row.title);
  row._full = (row._title + ' ' + (row.description || '')).toLowerCase();
  row._fullWords = wordsOf(row._full);
  row._modified = MODIFIED_RE.test(row._full);
  row._soldMs = Date.parse(row.posted_date) || null;
  return row;
}

// Short tokens like the "s" in "e63 s" must be whole words, or they match nearly every title.
function hasToken(text, words, t) {
  return t.length <= 2 ? words.includes(t) : matchStrength(text, words, t) > 0;
}

// The overlay honours the tab's year/price/mileage ranges so it compares like with like,
// plus its own sale-window, title, location and stock-only filters.
function visibleBatRows(tab) {
  const f = tab._state.filters, b = tab._state.bat;
  const within = (v, lo, hi) => v != null && (lo == null || v >= lo) && (hi == null || v <= hi);
  const tokens = b.text ? b.text.toLowerCase().split(/\s+/).filter(Boolean) : [];
  const include = tokens.filter(t => !t.startsWith('-'));
  const exclude = tokens.filter(t => t.startsWith('-') && t.length > 1).map(t => t.slice(1));
  const cutoff = b.days ? NOW_MS - b.days * DAY_MS : null;
  const sr = tab._range;
  return (tab.bat || []).filter(r =>
    r.price != null && r.mileage != null &&
    (!b.matchSearch || !sr || (within(r.year, sr.yMin, sr.yMax) && (sr.mMax == null || r.mileage <= sr.mMax))) &&
    ((f.yearMin == null && f.yearMax == null) || within(r.year, f.yearMin, f.yearMax)) &&
    ((f.priceMin == null && f.priceMax == null) || within(r.price, f.priceMin, f.priceMax)) &&
    ((f.milesMin == null && f.milesMax == null) || within(r.mileage, f.milesMin, f.milesMax)) &&
    inArea(tab, r) &&
    (cutoff == null || (r._soldMs != null && r._soldMs >= cutoff)) &&
    (!b.country || r.city === b.country) &&
    (!b.stock || !r._modified) &&
    include.every(t => hasToken(r._title, r._titleWords, t)) &&
    !exclude.some(t => hasToken(r._full, r._fullWords, t)));
}

function median(nums) {
  const a = nums.filter(n => n != null).sort((x, y) => x - y);
  if (!a.length) return null;
  const m = Math.floor(a.length / 2);
  return a.length % 2 ? a[m] : Math.round((a[m - 1] + a[m]) / 2);
}

// Year range and top mileage of the AutoTempest results, so BaT comparables default to the same cars.
function searchRange(rows) {
  const years = rows.map(r => r.year).filter(y => y != null);
  const miles = rows.map(r => r.mileage).filter(m => m != null);
  if (!years.length) return null;
  return { yMin: Math.min(...years), yMax: Math.max(...years), mMax: miles.length ? Math.max(...miles) : null };
}

function solve3(A, b) {
  const M = A.map((row, i) => [...row, b[i]]);
  for (let c = 0; c < 3; c++) {
    let piv = c;
    for (let r = c + 1; r < 3; r++) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
    [M[c], M[piv]] = [M[piv], M[c]];
    if (Math.abs(M[c][c]) < 1e-12) return null;
    for (let r = 0; r < 3; r++) {
      if (r === c) continue;
      const f = M[r][c] / M[c][c];
      for (let k = c; k < 4; k++) M[r][k] -= f * M[c][k];
    }
  }
  return M.map((row, i) => row[3] / row[i]);
}

// Like-for-like BaT market level over time. Fit log(price) on mileage and model year across
// the tab's stock BaT sales; whatever is left over, averaged around each sale date, is how
// hot or cold the market was then. Comparing that with the last 12 months gives (a) the
// recent trend and (b) a factor that restates an older sale in today's market.
function computeMarketIndex(tab) {
  const pts = (tab.bat || []).filter(r => !r._modified && r.price && r.mileage != null && r.year != null && r._soldMs);
  tab._market = null;
  if (pts.length < 12) return;
  const yBar = pts.reduce((a, r) => a + r.year, 0) / pts.length;
  const X = pts.map(r => [1, r.mileage / 1e4, r.year - yBar]);
  const y = pts.map(r => Math.log(r.price));
  const A = [0, 1, 2].map(i => [0, 1, 2].map(j => X.reduce((a, x) => a + x[i] * x[j], 0)));
  const bv = [0, 1, 2].map(i => X.reduce((a, x, n) => a + x[i] * y[n], 0));
  const beta = solve3(A, bv);
  if (!beta) return;
  pts.forEach((r, n) => { r._resid = y[n] - (beta[0] + beta[1] * X[n][1] + beta[2] * X[n][2]); });

  const meanResid = (lo, hi) => {
    const sel = pts.filter(r => r._soldMs >= lo && r._soldMs < hi);
    return sel.length ? { v: sel.reduce((a, r) => a + r._resid, 0) / sel.length, n: sel.length } : { v: null, n: 0 };
  };
  const recent = meanResid(NOW_MS - 365 * DAY_MS, NOW_MS + DAY_MS);
  const prior = meanResid(NOW_MS - 730 * DAY_MS, NOW_MS - 365 * DAY_MS);
  if (recent.n < 3) return;

  (tab.bat || []).forEach(r => {
    r._adj = null;
    if (!r._soldMs || r._soldMs >= NOW_MS - 365 * DAY_MS) { r._adj = 1; return; }
    for (const half of [183, 365]) {
      const local = meanResid(r._soldMs - half * DAY_MS, r._soldMs + half * DAY_MS);
      if (local.n >= 5) { r._adj = Math.exp(recent.v - local.v); return; }
    }
  });
  const level = recent.v;
  tab._market = {
    n: pts.length,
    trend: prior.n >= 3 ? Math.exp(recent.v - prior.v) - 1 : null,
    milesPct: Math.exp(beta[1]) - 1,
    yMin: Math.min(...pts.map(r => r.year)), yMax: Math.max(...pts.map(r => r.year)),
    mMax: Math.max(...pts.map(r => r.mileage)),
    predict: r => Math.exp(beta[0] + beta[1] * r.mileage / 1e4 + beta[2] * (r.year - yBar) + level),
  };
}

// Recent sales draw solid, older ones fade, so stale comps don't read as today's market.
function batAlpha(ageDays) {
  return Math.max(0.25, Math.min(1, 1 - (ageDays - 180) / 900));
}

function pct(v) { return fmtPct(v * 100); }

// BaT sales as chart points, restated in today's market when that toggle is on.
function batPoints(tab) {
  const adjust = tab._state.bat.adjust && tab._market;
  return visibleBatRows(tab).map(d => {
    const now = adjust && d._adj ? Math.round(d.price * d._adj) : d.price;
    const restated = now !== d.price ? ` · ≈ ${fmtPrice(now)} in today's market` : '';
    return {
      x: d.mileage, y: now, title: d.title, link: d.link, date: d.posted_date,
      age: d._soldMs ? (NOW_MS - d._soldMs) / DAY_MS : 9999,
      dealer: `sold ${fmtPrice(d.price)} on ${d.posted_date} (BaT)${restated}`,
    };
  });
}

// Likely BaT sale today for a listing's year and mileage, from the like-for-like BaT fit.
// Only inside the model years and mileage the BaT sales actually cover.
function applyBatValues(tab) {
  const m = tab._market;
  tab.rows.forEach(r => {
    r.bat_value = null; r.vs_bat = null;
    if (!m || r.year == null || r.mileage == null) return;
    if (r.year < m.yMin || r.year > m.yMax || r.mileage > m.mMax * 1.1) return;
    r.bat_value = Math.round(m.predict(r) / 500) * 500;
    if (r.price != null) r.vs_bat = r.price / r.bat_value - 1;
  });
}

function batValueCell(d) {
  if (d.bat_value == null) return '<span class="muted">–</span>';
  const gap = d.vs_bat != null ? `<small>ask ${pct(d.vs_bat)}</small>` : '';
  return `${fmtPrice(d.bat_value)}${gap}`;
}

function kpi(label, value, note, cls = '') {
  return `<div class="kpi ${cls}"><span>${label}</span><b>${value}</b>${note ? `<em>${note}</em>` : ''}</div>`;
}

function renderKpis(tab) {
  const el = tab._panel.querySelector('[data-role=kpis]');
  const rows = visibleRows(tab).filter(r => r.price != null);
  if (!rows.length) { el.innerHTML = ''; return; }
  const cards = [];
  const askMed = median(rows.map(r => r.price)), milesMed = median(rows.map(r => r.mileage));
  const years = rows.map(r => r.year).filter(Boolean);
  cards.push(kpi('For sale', rows.length.toLocaleString(), `median ask ${fmtPrice(askMed)}`));
  cards.push(kpi('Median hours', milesMed != null ? fmtMiles(milesMed) : '–', years.length ? `model years ${Math.min(...years)}–${Math.max(...years)}` : ''));

  const best = rows.filter(r => r.vs_market != null && !r._outlier).sort((a, b) => a.vs_market - b.vs_market)[0];
  if (best) {
    const link = safeUrl(best.link);
    const note = `${best.year ?? ''} · ${fmtPrice(best.price)} · ${fmtMiles(best.mileage)}`;
    cards.push(kpi('Best vs market', `<span class="${best.vs_market < 0 ? 'below' : ''}">${fmtPct(best.vs_market)}</span>`,
      link ? `<a href="${escapeHtml(link)}" target="_blank" rel="noopener" title="${escapeHtml(best.title)}">${escapeHtml(note)} &#8599;</a>` : escapeHtml(note)));
  }

  if (tab.bat && tab.bat.length) {
    const pts = batPoints(tab);
    const days = tab._state.bat.days;
    const window = days ? (days % 365 === 0 ? `${days / 365 * 12} mo` : `${Math.round(days / 30)} mo`) : 'all time';
    if (pts.length) {
      const soldMed = median(pts.map(d => d.y)), soldMiles = median(pts.map(d => d.x));
      cards.push(kpi(`BaT sold · ${window}`, pts.length.toLocaleString(), `median ${fmtPrice(soldMed)} at ${fmtMiles(soldMiles)}`, 'bat'));
      cards.push(pts.length >= 3
        ? kpi('Asking vs sold', pct(askMed / soldMed - 1), 'median ask vs median BaT sale', 'bat')
        : kpi('Asking vs sold', '–', `only ${pts.length} BaT sale; too few to compare`, 'bat'));
    } else {
      cards.push(kpi(`BaT sold · ${window}`, '0', 'no matching sales; widen the BaT filters', 'bat'));
    }
    const m = tab._market;
    cards.push(kpi('BaT market · 12 mo', m && m.trend != null ? pct(m.trend) : '–',
      m && m.trend != null ? 'same hours and year, vs prior 12 mo' : 'too few recent sales', 'bat'));
  }
  el.innerHTML = cards.join('');
}

function visibleRows(tab) {
  const f = tab._state.filters;
  const textTokens = f.text ? f.text.toLowerCase().split(/\s+/).filter(Boolean) : [];
  const dealMin = f.deal ? DEAL_RANK[f.deal] : 0;
  const within = (v, lo, hi) => v != null && (lo == null || v >= lo) && (hi == null || v <= hi);

  const rows = tab.rows.filter(r => {
    if ((f.yearMin != null || f.yearMax != null) && !within(r.year, f.yearMin, f.yearMax)) return false;
    if ((f.priceMin != null || f.priceMax != null) && !within(r.price, f.priceMin, f.priceMax)) return false;
    if ((f.milesMin != null || f.milesMax != null) && !within(r.mileage, f.milesMin, f.milesMax)) return false;
    if (dealMin && (DEAL_RANK[r.deal_rating] || 0) < dealMin) return false;
    if (f.color && r.color !== f.color) return false;
    if (f.specs.length) {
      const groups = {};
      f.specs.forEach(n => { (groups[SPEC_GROUP[n]] = groups[SPEC_GROUP[n]] || []).push(n); });
      if (!Object.values(groups).every(any => any.some(n => r._specs.includes(n)))) return false;
    }
    if (f.vs) {
      if (r.vs_market == null || r._outlier) return false;
      if (f.vs === 'below' && r.vs_market > -5) return false;
      if (f.vs === 'below10' && r.vs_market > -10) return false;
      if (f.vs === 'above' && r.vs_market < 5) return false;
    }
    for (const t of textTokens) if (!matchStrength(r._text, r._words, t)) return false;
    if (!inArea(tab, r)) return false;
    return true;
  });

  const { sortKey, sortDir } = tab._state;
  rows.sort((a, b) => {
    const av = sortVal(a, sortKey), bv = sortVal(b, sortKey);
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
    return (av - bv) * sortDir;
  });
  return rows;
}

    <div class="panel">
