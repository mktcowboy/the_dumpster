cv.onmousemove=e=>{if(!G)return;const rc=cv.getBoundingClientRect(),mx=e.clientX-rc.left;let i=Math.round((mx-G.P.l)/G.pw*(G.n-1));if(i<0||i>=G.n){tip.style.display='none';return}
 let h=`<b>${dates[G.i0+i]}</b><br>`;
 if(G.o){const r=G.series[S.sel][i];h+=`${S.sel} O ${r[0].toFixed(2)} H ${r[1].toFixed(2)} L ${r[2].toFixed(2)} C ${r[3].toFixed(2)}`}
 else Object.keys(G.series).sort((a,b)=>G.series[b][i]-G.series[a][i]).forEach(t=>h+=`<span style="color:${C[t]}">■</span> ${t} ${G.series[t][i].toFixed(1)}<br>`);
 tip.innerHTML=h;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-200)+'px';tip.style.top=(e.clientY+14)+'px';
 draw0(G.x(i))};
cv.onmouseleave=()=>{tip.style.display='none';draw()};
function draw0(xx){draw();ctx.strokeStyle='#8d9aa8';ctx.beginPath();ctx.moveTo(xx,G.P.t);ctx.lineTo(xx,cv.clientHeight-G.P.b);ctx.stroke()}
let sortK='YTD';
function table(){const ks=['1M','3M','YTD','1Y'];const R=T.map(t=>{const o={t};ks.forEach(k=>{const i=startIdx(k);o[k]=(D[t][D[t].length-1][4]/D[t][i][4]-1)*100});return o}).sort((a,b)=>b[sortK]-a[sortK]);
 const cl=v=>{const a=Math.min(1,Math.abs(v)/25);return v>=0?`rgba(58,150,80,${.15+.6*a})`:`rgba(214,64,43,${.15+.6*a})`};
 tbl.innerHTML='<tr><th>Sector</th>'+ks.map(k=>`<th data-k="${k}">${k}${k==sortK?' ▼':''}</th>`).join('')+'</tr>'+R.map(r=>`<tr><td><span style="color:${C[r.t]}">■</span> ${r.t} ${N[r.t]}</td>`+ks.map(k=>`<td style="background:${cl(r[k])}">${r[k]>=0?'+':''}${r[k].toFixed(1)}%</td>`).join('')+'</tr>').join('');
 tbl.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{sortK=th.dataset.k;table()})}
addEventListener('resize',draw);draw();
</script></body></html>
