<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Futures Curves · Term Structure Report</title>
<style>
:root{--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--r:14px}
[data-theme=dark]{--bg:#0a0e16;--bg2:#0d121c;--panel:#111724;--panel2:#161d2d;--line:#222b3d;--line2:#2b3650;--text:#e7ebf3;--muted:#8d98ae;--dim:#5f6a80;
  --up:#2ebd85;--down:#f6465d;--accent:#5b8cff;--accent2:#8b5cf6;--con:#7c8cff;--back:#f5a524;--flat:#8d98ae;--hdr:rgba(10,14,22,.86);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.25);--grid:rgba(141,152,174,.12);--tipbg:#0b1019}
[data-theme=light]{--bg:#f4f6fa;--bg2:#eef1f7;--panel:#ffffff;--panel2:#f7f9fc;--line:#e3e8f0;--line2:#d4dbe7;--text:#0f172a;--muted:#5b6579;--dim:#8a93a6;
  --up:#0f9d6b;--down:#e0364f;--accent:#3366ff;--accent2:#7c3aed;--con:#4f5ee8;--back:#d98200;--flat:#5b6579;--hdr:rgba(244,246,250,.86);--shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);--grid:rgba(15,23,42,.07);--tipbg:#ffffff}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
a{color:inherit}
header{position:sticky;top:0;z-index:30;background:var(--hdr);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
.bar{display:flex;align-items:center;gap:18px;padding:14px 0 10px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none;box-shadow:0 6px 18px rgba(91,140,255,.35)}
.brand h1{margin:0;font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand .sub{font-size:12px;color:var(--muted)}
.sp{flex:1}
.search{position:relative}
.search input{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 12px 8px 32px;font:inherit;font-size:13px;width:220px;outline:none;transition:border-color .15s}
.search input:focus{border-color:var(--accent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.tbtn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font:inherit;font-size:12.5px}
.tbtn:hover{border-color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-size:13px;font-weight:550;padding:9px 12px 11px;border-bottom:2px solid transparent;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
nav.tabs a:hover{color:var(--text)}
nav.tabs a.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs a .n{font-size:10.5px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);padding:0 6px;border-radius:20px;line-height:16px}
main{padding:26px 0 30px}
.view{display:none}.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:1.1fr 1fr 1fr 1fr;gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi h3,.ttl{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:650}
.big{font-size:32px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;line-height:1.1}
.big small{font-size:16px;color:var(--dim);font-weight:500}
.split{height:8px;border-radius:5px;overflow:hidden;display:flex;margin:12px 0 8px;background:var(--panel2)}
.split i{display:block;height:100%}
.leg{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.leg b{font-weight:600;color:var(--text);font-family:var(--mono)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}
.mv{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;font-size:13px;border-radius:6px}
.mv:hover .s{color:var(--accent)}
.mv .s{font-family:var(--mono);font-weight:700;width:34px}
.mv .nm{color:var(--muted);font-size:12px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .v{font-family:var(--mono);font-size:12.5px;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.flatc{color:var(--muted)}
.panel{padding:18px 20px;margin-bottom:16px}
.phead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.phead h2{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.phead .note{font-size:12px;color:var(--dim)}
#rybar{height:250px}
.tw{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{padding:9px 12px;text-align:right;white-space:nowrap}
thead th{position:sticky;top:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:650;background:var(--panel2);border-bottom:1px solid var(--line);user-select:none}
th.srt{cursor:pointer}th.srt:hover{color:var(--text)}
th.on{color:var(--accent)}
th.on::after{content:attr(data-dir);margin-left:4px}
.al{text-align:left}
td{border-bottom:1px solid var(--line);font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--panel2)}
#ovt tbody tr{cursor:pointer}
td.sym{font-family:var(--mono);font-weight:700;color:var(--accent)}
td.num{font-family:var(--mono);font-size:12.5px}
td.nm{font-weight:500}
#ovt td{padding:7px 10px}#ovt th{padding:9px 10px}#ovt td:first-child,#ovt th:first-child{padding-left:20px}#ovt td:last-child,#ovt th:last-child{padding-right:20px}.grp{color:var(--dim);font-size:11px;font-weight:500;line-height:1.2}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 9px 3px 8px;border-radius:20px;border:1px solid;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-con{color:var(--con);border-color:color-mix(in srgb,var(--con) 35%,transparent);background:color-mix(in srgb,var(--con) 10%,transparent)}
.b-back{color:var(--back);border-color:color-mix(in srgb,var(--back) 40%,transparent);background:color-mix(in srgb,var(--back) 10%,transparent)}
.b-flat,.b-na{color:var(--flat);border-color:var(--line2);background:var(--panel2)}
.ry{display:inline-flex;align-items:center;justify-content:flex-end;gap:8px}
.rybar{width:60px;height:6px;border-radius:3px;background:var(--panel2);position:relative;overflow:hidden;border:1px solid var(--line)}
.rybar i{position:absolute;top:0;bottom:0}
.rybar::after{content:"";position:absolute;left:50%;top:-1px;bottom:-1px;width:1px;background:var(--line2)}
svg.spark{display:block}
.ghost{color:var(--dim)}
footer{border-top:1px solid var(--line);color:var(--dim);font-size:12px;padding:20px 0 40px;line-height:1.65}
footer b{color:var(--muted);font-weight:600}
/* group view */
.gintro{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.gintro h2{margin:0;font-size:24px;letter-spacing:-.02em}
.gintro p{margin:2px 0 0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:12px;font-weight:650;text-decoration:none;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;display:inline-flex;gap:6px;align-items:center}
.chip:hover{color:var(--text);border-color:var(--accent)}
.chip i{width:6px;height:6px;border-radius:50%}
.mkt{margin-bottom:22px;overflow:hidden}
.mh{display:flex;align-items:flex-start;gap:18px;padding:18px 22px 14px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.mh .id{flex:1;min-width:240px}
.mh .tk{font-family:var(--mono);font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.06em}
.mh h3{margin:2px 0 6px;font-size:20px;font-weight:700;letter-spacing:-.015em}
.mh .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.mh .meta span.sep{color:var(--line2)}
.mh .px{text-align:right}
.mh .px .p{font-family:var(--mono);font-size:26px;font-weight:700;letter-spacing:-.02em}
.mh .px .c{font-family:var(--mono);font-size:12.5px}
.stats{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:11px 22px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats small{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
.stats b{font-family:var(--mono);font-size:14.5px;font-weight:650}
.charts{display:grid;grid-template-columns:1.35fr 1fr;border-bottom:1px solid var(--line)}
.charts>div{padding:14px 18px 12px;min-width:0}
.charts>div+div{border-left:1px solid var(--line)}
.ch-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.ch-h .ttl{margin:0}
.cbox{position:relative;height:270px}
.lg{display:flex;gap:12px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.lg i{display:inline-block;width:16px;height:0;border-top:2px solid;margin-right:5px;vertical-align:middle}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:6px;cursor:pointer}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--accent);color:#fff}
.ctab th:first-child,.ctab td:first-child{padding-left:22px}
.ctab th:last-child,.ctab td:last-child{padding-right:22px}
.tag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.f{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tag.x{background:var(--panel2);color:var(--dim);border:1px solid var(--line)}
.tag.s{background:transparent;color:var(--dim);border:1px dashed var(--line2)}
tr.front td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tr.pre td{opacity:.62}
.spb{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.spb .bb{width:64px;height:6px;position:relative;background:var(--panel2);border-radius:3px;border:1px solid var(--line)}
.spb .bb i{position:absolute;top:0;bottom:0;border-radius:2px}
.spb .bb::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--line2)}
.na{padding:40px;text-align:center;color:var(--dim)}
.more{display:block;width:100%;background:var(--panel2);border:0;border-top:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:9px;cursor:pointer}
.more:hover{color:var(--text)}
.ctab tr.hid{display:none}
@media(max-width:1080px){.kpis{grid-template-columns:1fr 1fr}.charts{grid-template-columns:1fr}.charts>div+div{border-left:0;border-top:1px solid var(--line)}.stats{grid-template-columns:repeat(3,1fr)}.stats div:nth-child(3n){border-right:0}.stats div:nth-child(-n+3){border-bottom:1px solid var(--line)}}
@media(max-width:640px){.stats div{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)!important}.stats div:nth-child(2n){border-right:0!important}.stats div:nth-last-child(-n+2){border-bottom:0!important}.wrap{padding:0 16px}.kpis{grid-template-columns:1fr}.search input{width:140px}.brand .sub{display:none}.stats{grid-template-columns:repeat(2,1fr)}.mh .px{text-align:left}.tbtn span{display:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-1 4.5-7 8-8s5 3 10-5"/><circle cx="3" cy="17" r="1.2" fill="#fff"/><circle cx="11" cy="9" r="1.2" fill="#fff"/><circle cx="21" cy="4" r="1.2" fill="#fff"/></svg></div>
      <div class="brand"><h1>Futures Curves</h1><div class="sub" id="asof"></div></div>
      <div class="sp"></div>
      <div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Search market…" autocomplete="off"></div>
      <button class="tbtn" id="theme" title="Toggle light / dark"><svg id="ticon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg><span id="tlabel"></span></button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>
<main class="wrap">
  <section class="view" id="v-overview">
    <div class="kpis" id="kpis"></div>
    <div class="card panel">
      <div class="phead"><h2>Annualized roll yield by market</h2><span class="note">Front vs ~12-month contract (or furthest listed) · positive = backwardation · click a bar to open</span></div>
      <div style="position:relative" id="rybar"><canvas></canvas></div>
    </div>
    <div class="card">
      <div class="phead" style="padding:16px 20px 6px"><h2>All markets</h2><span class="note" id="ovnote">Click a column to sort · click a row for the full curve</span></div>
      <div class="tw"><table id="ovt"><thead></thead><tbody></tbody></table></div>
    </div>
  </section>
  <div id="gviews"></div>
  <footer id="foot"></footer>
</main>

function spark(r,w=118,h=34){
  if(!r.ok||r.c.length<2)return`<svg class="spark" width="${w}" height="${h}"><line x1="4" x2="${w-4}" y1="${h/2}" y2="${h/2}" stroke="var(--line2)" stroke-dasharray="3 3"/></svg>`;
  const cs=r.c.slice(r.fi),x0=mi(cs[0]),xs=cs.map(c=>mi(c)-x0),xm=Math.max(...xs)||1;
  const vals=cs.flatMap(c=>[c.last,c.m1].filter(v=>v!=null)),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
  const X=i=>3+xs[i]/xm*(w-6),Y=v=>h-3-(v-mn)/rg*(h-6);
  const line=k=>cs.map((c,i)=>c[k]==null?null:[X(i),Y(c[k])]).filter(Boolean).map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join("");
  const col=stCol(r);
  return`<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><path d="${line("m1")}" fill="none" stroke="var(--dim)" stroke-width="1" stroke-dasharray="2 2" opacity=".8"/><path d="${line("last")}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${X(0)}" cy="${Y(cs[0].last)}" r="2.2" fill="${col}"/></svg>`}
function fspark(r,w=90,h=28){if(!r.h)return"–";const d=r.h,mn=Math.min(...d),mx=Math.max(...d);

  return`<svg class="spark" width="${w}" height="${h}"><polyline points="${p}" fill="none" stroke="${d[d.length-1]>=d[0]?css("--up"):css("--down")}" stroke-width="1.3" stroke-linejoin="round"/></svg>`}
