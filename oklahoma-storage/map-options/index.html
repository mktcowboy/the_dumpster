<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oklahoma storage map — three directions</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{--navy:#1b2a4a;--ink:#141414;--muted:#5b5b55;--paper:#f7f7f5;--line:#d9d9d6;--accent:#875106}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff}
  header{padding:20px 24px 14px;border-bottom:3px double var(--navy)}
  header h1{margin:0 0 4px;font:600 24px/1.2 Georgia,serif;color:var(--navy)}
  header p{margin:0;color:var(--muted);max-width:95ch}
  .tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 24px;background:#fff;position:sticky;top:0;z-index:600}
  .tabs button{background:#fff;border:0;border-bottom:3px solid transparent;color:var(--muted);padding:12px 16px;font:inherit;font-weight:600;cursor:pointer}
  .tabs button[aria-selected=true]{color:var(--navy);border-bottom-color:var(--navy)}
  .tabs button:hover{background:var(--paper)}
  .layout{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100vh - 132px);min-height:560px}
  aside{overflow:auto;padding:18px 20px 40px;border-right:1px solid var(--line);background:var(--paper)}
  #map{height:100%;min-height:420px;z-index:0}
  h2{font:600 17px/1.3 Georgia,serif;color:var(--navy);margin:0 0 8px}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
  p{margin:0 0 12px}
  .note{font-size:13px;color:var(--muted)}
  .stat{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
  .stat b{font-variant-numeric:tabular-nums}
  .list{margin:0;padding:0;list-style:none}
  .list li{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .list li:hover{background:#fff}
  .list .bar{grid-column:1/-1;height:4px;background:#e4e4df;margin-top:-2px}
  .list .bar i{display:block;height:100%;background:var(--navy)}
  .list small{color:var(--muted);display:block}
  .legend{display:flex;flex-direction:column;gap:6px;margin:10px 0}
  .legend label{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
  .legend input{margin:0}
  .sw{width:12px;height:12px;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);flex:0 0 auto}
  select,input[type=search]{width:100%;padding:8px;border:1px solid #a3a39c;background:#fff;font:inherit;min-height:38px}
  .btn{display:inline-block;border:1px solid var(--navy);background:#fff;color:var(--navy);padding:7px 10px;font:inherit;cursor:pointer;margin:8px 0}
  .btn:hover{background:var(--navy);color:#fff}
  #status{font-size:12px;color:var(--muted);margin:10px 0 0}
  .facility-list li{cursor:default;grid-template-columns:1fr}
  .facility-list b{font-weight:600}
  .city-label{background:rgba(255,255,255,.93);border:1px solid #c9c9c3;box-shadow:0 1px 2px rgba(0,0,0,.18);font:600 10px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy);text-align:center;padding:2px 5px;white-space:nowrap}
  .city-label:before{display:none}
  .city-label b{font-weight:700}
  .bench{background:#fff;border:2px solid var(--accent);color:var(--accent);font:700 9px/1 Arial,sans-serif;padding:3px 4px;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.3);text-align:center}
  .rate-label{background:rgba(255,255,255,.92);border:1px solid #c9c9c3;color:#141414;font:700 10px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;padding:2px 4px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .rate-label:before{display:none}
  .leaflet-popup-content{font-size:13px;line-height:1.45;min-width:180px}
  .leaflet-popup-content b{color:var(--navy)}
  .pop-cat{display:inline-block;font-size:11px;color:#fff;padding:2px 6px;border-radius:2px;margin-bottom:5px}
  .pop-note{color:var(--muted);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;color:var(--muted);border-bottom:1px solid var(--line);padding:5px 4px;font-weight:600}
  td{padding:5px 4px;border-bottom:1px solid #ecece7;vertical-align:top}
  td.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  @media(max-width:800px){.layout{display:block;height:auto}aside{max-height:none;border-right:0;border-bottom:1px solid var(--line)}#map{height:65vh}}
</style>
</head>
<body>
<header>
  <h1>Oklahoma storage map — three directions</h1>
  <p>A prototype for comparing map designs against the same 865-record directory. Nothing here changes the report; it reuses <code>report-data.json</code>.</p>
</header>
<div class="tabs" role="tablist">
  <button role="tab" data-mode="density" aria-selected="true">1 · Density by city</button>
  <button role="tab" data-mode="ownership" aria-selected="false">2 · Ownership</button>
  <button role="tab" data-mode="rent" aria-selected="false">3 · Rent evidence</button>
</div>
<div class="layout">
  <aside id="panel"></aside>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.MAP_DATA;
  var facilities = DATA.facilities;
  var companies = DATA.companies;
  var companyById = {};
  companies.forEach(function (c) { companyById[c.id] = c; });

  var CAT_COLORS = {
    'Public REIT': '#1b4f72',
    'Public company (non-REIT)': '#2e86c1',
    'Private equity platform': '#8e44ad',
    'Institutional private capital': '#c0392b',
    'Regional operator; capital unverified': '#d68910',
    'Private / family-owned': '#1e8449',
    'Brand network / separate owners': '#16a085',
    'Ownership unverified': '#a8a8a2'
  };
  var CAT_ORDER = Object.keys(CAT_COLORS);

  var map = L.map('map', { scrollWheelZoom: true }).setView([35.45, -97.4], 7);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16,
    attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ'
  }).addTo(map);
  var refLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 16
  });
  function updateRef() {
    if (map.getZoom() >= 11) { if (!map.hasLayer(refLayer)) refLayer.addTo(map); }
    else if (map.hasLayer(refLayer)) map.removeLayer(refLayer);
  }
  map.on('zoomend', updateRef);

  var overlay = L.layerGroup().addTo(map);
  var detail = L.layerGroup().addTo(map);
  var mode = 'density';
  var focusedCity = null;
  var selectedCompany = null;
  var activeCats = {};
  CAT_ORDER.forEach(function (c) { activeCats[c] = true; });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function categoryOf(f) {
    var c = companyById[f.company_id];
    return c ? c.category : 'Ownership unverified';
  }
  function catColor(f) { return CAT_COLORS[categoryOf(f)] || CAT_COLORS['Ownership unverified']; }
  function hasCoords(f) { return Number.isFinite(f.lat) && Number.isFinite(f.lng); }
  function clearMap() { overlay.clearLayers(); detail.clearLayers(); map.closePopup(); }
  function panel(html) { document.getElementById('panel').innerHTML = html; }
  function status(text) { document.getElementById('status').textContent = text; }

  function facilityPopup(f) {
    var cat = categoryOf(f);
    return '<span class="pop-cat" style="background:' + catColor(f) + '">' + esc(cat) + '</span>' +
      '<br><b>' + esc(f.name) + '</b><br>' + esc(f.address) + '<br>' + esc(f.city) +
      (f.geo_approx ? '<br><span class="pop-note">Approximate location</span>' : '') +
      '<br><span class="pop-note">' + esc(f.company_name || '') + '</span>';
  }

  function backButton() {
    if (!focusedCity) return '';
    return '<button class="btn" id="back">← Back to statewide</button>';
  }

  function bindBack() {
    var b = document.getElementById('back');
    if (b) b.addEventListener('click', function () { focusedCity = null; render(); });
  }

  /* ---------- 1. Density by city ---------- */

  function cityStats() {
    var by = {};
    facilities.forEach(function (f) {
      if (!hasCoords(f) || !f.city) return;
      var s = by[f.city] || (by[f.city] = { city: f.city, n: 0, lat: 0, lng: 0, approx: 0, regions: {}, items: [] });
      s.n++;
      s.lat += f.lat;
      s.lng += f.lng;
      if (f.geo_approx) s.approx++;
      s.regions[f.region] = (s.regions[f.region] || 0) + 1;
      s.items.push(f);
    });
    return Object.keys(by).map(function (k) {
      var s = by[k];
      s.lat /= s.n;
      s.lng /= s.n;
      return s;
    }).sort(function (a, b) { return b.n - a.n; });
  }

  function countColor(n) {
    if (n >= 40) return '#16324f';
    if (n >= 25) return '#2c5378';
    if (n >= 15) return '#4a769b';
    if (n >= 10) return '#7599b5';
    return '#a9bdcb';
  }

  function focusCity(name) {
    var items = facilities.filter(function (f) { return f.city === name && hasCoords(f); });
    if (!items.length) return;
    focusedCity = name;
    detail.clearLayers();
    var group = [];
    items.forEach(function (f) {
      var m = L.circleMarker([f.lat, f.lng], {
        radius: 6, color: '#fff', weight: 1.5, fillColor: catColor(f), fillOpacity: 0.9
      }).bindPopup(facilityPopup(f));
      detail.addLayer(m);
      group.push([f.lat, f.lng]);
    });
    map.fitBounds(group, { padding: [35, 35], maxZoom: 13 });
    renderDensityPanel(true);
    bindBack();
  }

  function renderDensityPanel(detailView) {
    var stats = cityStats();
    var mapped = stats.reduce(function (n, s) { return n + s.n; }, 0);
    var approx = facilities.filter(function (f) { return f.geo_approx; }).length;
    if (detailView) {
      var s = stats.filter(function (x) { return x.city === focusedCity; })[0];
      var items = s ? s.items : [];
      var html = backButton() + '<h2>' + esc(focusedCity) + '</h2>' +
        '<div class="stat"><span>Records mapped here</span><b>' + items.length + '</b></div>' +
        '<div class="stat"><span>Approximate coordinates</span><b>' + items.filter(function (f) { return f.geo_approx; }).length + '</b></div>' +
        '<h3>Facilities</h3><ul class="list facility-list">';
      items.sort(function (a, b) { return a.name.localeCompare(b.name); }).forEach(function (f) {
        html += '<li><b>' + esc(f.name) + '</b><small>' + esc(f.address) + '</small></li>';
      });
      html += '</ul><p class="note" id="status">Click a pin for its details.</p>';
      panel(html);
      return;
    }
    var html = '<h2>Statewide shape</h2>' +
      '<p class="note">One bubble per city, sized by directory records. Click a bubble or a city in the list to drill down to facility pins.</p>' +
      '<div class="stat"><span>Directory records</span><b>' + facilities.length + '</b></div>' +
      '<div class="stat"><span>Mapped in this view</span><b>' + mapped + '</b></div>' +
      '<div class="stat"><span>Approximate coordinates</span><b>' + approx + '</b></div>' +
      '<div class="stat"><span>No coordinates</span><b>' + (facilities.length - mapped) + '</b></div>' +
      '<h3>Largest recorded cities</h3><ul class="list">';
    var max = stats.length ? stats[0].n : 1;
    stats.slice(0, 20).forEach(function (s) {
      html += '<li data-city="' + esc(s.city) + '"><span>' + esc(s.city) + '<small>' + s.n + ' records' +
        (s.approx ? ' · ' + s.approx + ' approximate' : '') + '</small></span><b>' + s.n + '</b>' +
        '<div class="bar"><i style="width:' + Math.max(3, Math.round(100 * s.n / max)) + '%"></i></div></li>';
    });
    html += '</ul><p class="note">Bubble size is record count, not verified operating facilities. Approximate pins are included in city totals.</p>';
    panel(html);
    document.querySelectorAll('#panel li[data-city]').forEach(function (li) {
      li.addEventListener('click', function () { focusCity(li.getAttribute('data-city')); });
    });
  }

  function renderDensity() {
    var stats = cityStats();
    overlay.clearLayers();
    detail.clearLayers();
    focusedCity = null;
    var labels = [];
    stats.forEach(function (s) {
      var radius = 6 + Math.sqrt(s.n) * 3.1;
      var m = L.circleMarker([s.lat, s.lng], {
        radius: radius, color: '#fff', weight: 1.5, fillColor: countColor(s.n), fillOpacity: 0.82
      });
      m.bindPopup('<b>' + esc(s.city) + '</b><br>' + s.n + ' directory records' +
        (s.approx ? '<br><span class="pop-note">' + s.approx + ' approximate coordinates</span>' : '') +
        '<br><span class="pop-note">Click the bubble to list facilities.</span>');
      m.on('click', function () { focusCity(s.city); });
      overlay.addLayer(m);
      labels.push({ s: s, m: m });
    });
    map.setView([35.45, -97.4], 7);
    var placed = [];
    labels.slice(0, 20).forEach(function (x) {
      var p = map.latLngToContainerPoint([x.s.lat, x.s.lng]);
      if (placed.some(function (q) { return q.distanceTo(p) < 70; })) return;
      placed.push(p);
      x.m.bindTooltip(esc(x.s.city) + ' <b>' + x.s.n + '</b>', {
        permanent: true, direction: 'top', className: 'city-label', opacity: 1
      });
    });
    renderDensityPanel(false);
  }

  /* ---------- 2. Ownership ---------- */

  function renderOwnershipPanel() {
    var counts = {};
    CAT_ORDER.forEach(function (c) { counts[c] = 0; });
    facilities.forEach(function (f) { counts[categoryOf(f)] = (counts[categoryOf(f)] || 0) + 1; });

    var top = companies.filter(function (c) { return c.record_count > 0 && !c.research_only; })
      .sort(function (a, b) { return b.record_count - a.record_count; }).slice(0, 60);

    var html = '<h2>Who owns where</h2>' +
      '<p class="note">Facilities are colored by the report’s ownership category. Most records remain unverified; the smaller colored set is the researched part.</p>' +
      '<h3>Categories</h3><div class="legend">';
    CAT_ORDER.forEach(function (c) {
      html += '<label><input type="checkbox" data-cat="' + esc(c) + '"' + (activeCats[c] ? ' checked' : '') + '>' +
        '<span class="sw" style="background:' + CAT_COLORS[c] + '"></span>' + esc(c) + ' <b>(' + counts[c] + ')</b></label>';
    });
    html += '</div><h3>Isolate a company</h3><select id="company"><option value="">All companies</option>';
    top.forEach(function (c) {
      html += '<option value="' + esc(c.id) + '"' + (selectedCompany === c.id ? ' selected' : '') + '>' +
        esc(c.name) + ' (' + c.record_count + ')</option>';
    });
    html += '</select>';
    if (selectedCompany) {
      var c = companyById[selectedCompany];
      html += '<button class="btn" id="clearCompany">Clear selection</button>' +
        '<h3>Selected company</h3>' +
        '<div class="stat"><span>Category</span><b>' + esc(c.category) + '</b></div>' +
        '<div class="stat"><span>Parent / platform</span><b>' + esc(c.parent || '—') + '</b></div>' +
        '<div class="stat"><span>Records</span><b>' + c.record_count + '</b></div>' +
        '<p class="note">' + esc(c.ownership_note || '') + '</p>';
    } else {
      html += '<h3>Largest researched profiles</h3><ul class="list">';
      top.slice(0, 14).forEach(function (c) {
        html += '<li data-company="' + esc(c.id) + '"><span>' + esc(c.name) + '<small>' + esc(c.category) + '</small></span><b>' + c.record_count + '</b></li>';
      });
      html += '</ul>';
    }
    html += '<p class="note">Category labels come from the report; a brand or operator affiliation does not prove real-estate ownership.</p>';
    panel(html);

    document.querySelectorAll('#panel input[data-cat]').forEach(function (el) {
      el.addEventListener('change', function () {
        activeCats[el.getAttribute('data-cat')] = el.checked;
        drawOwnership();
      });
    });
    var sel = document.getElementById('company');
    if (sel) sel.addEventListener('change', function () {
      selectedCompany = sel.value || null;
      render();
    });
    var clear = document.getElementById('clearCompany');
    if (clear) clear.addEventListener('click', function () { selectedCompany = null; render(); });
    document.querySelectorAll('#panel li[data-company]').forEach(function (li) {
      li.addEventListener('click', function () { selectedCompany = li.getAttribute('data-company'); render(); });
    });
  }

  function drawOwnership() {
    overlay.clearLayers();
    detail.clearLayers();
    var selected = selectedCompany ? facilities.filter(function (f) { return f.company_id === selectedCompany && hasCoords(f); }) : null;
    var pts = [];
    facilities.forEach(function (f) {
      if (!hasCoords(f)) return;
      var cat = categoryOf(f);
      if (!activeCats[cat]) return;
      if (selected && f.company_id !== selectedCompany) return;
      var unverified = cat === 'Ownership unverified';
      var m = L.circleMarker([f.lat, f.lng], {
        radius: selected ? 7 : (unverified ? 3.6 : 5),
        color: '#fff',
        weight: selected ? 1.5 : 0.8,
        fillColor: CAT_COLORS[cat],
        fillOpacity: selected ? 0.95 : (unverified ? 0.45 : 0.85)
      }).bindPopup(facilityPopup(f));
      overlay.addLayer(m);
      pts.push([f.lat, f.lng]);
    });
    if (selected && pts.length) map.fitBounds(pts, { padding: [40, 40], maxZoom: 12 });
  }

  function renderOwnership() {
    map.setView([35.45, -97.4], 7);
    renderOwnershipPanel();
    drawOwnership();
  }

  /* ---------- 3. Rent evidence ---------- */

  function sqft(size) {
    var m = String(size || '').match(/(\d+)\s*[x×]\s*(\d+)/i);
    return m ? Number(m[1]) * Number(m[2]) : null;
  }
  function money(n) { return '$' + Number(n).toLocaleString('en-US'); }
  function psf(rate) {
    var s = sqft(rate.size);
    if (!s || !Number.isFinite(rate.price)) return null;
    return rate.price / s;
  }
  function rentColor(v) {
    if (v == null) return '#9a9a94';
    if (v < 0.55) return '#fee5d9';
    if (v < 0.75) return '#fcbba1';
    if (v < 1.00) return '#fc9272';
    if (v < 1.30) return '#fb6a4a';
    return '#a50f15';
  }

  function rateGroups() {
    var by = {};
    DATA.rates.forEach(function (r) {
      var fid = (r.facility_ids && r.facility_ids[0]) || null;
      if (!fid) return;
      (by[fid] || (by[fid] = [])).push(r);
    });
    return by;
  }

  function benchmarkGroups() {
    var by = {};
    DATA.benchmarks.forEach(function (b) {
      (by[b.city] || (by[b.city] = [])).push(b);
    });
    return by;
  }

  function rentPopup(f, obs) {
    var html = '<b>' + esc(f.name) + '</b><br>' + esc(f.address) + '<br>' + esc(f.city) + '<hr style="border:0;border-top:1px solid #ddd;margin:7px 0">';
    obs.forEach(function (r) {
      var v = psf(r);
      html += '<div style="margin:4px 0"><b>' + esc(r.size) + '</b> · ' + money(r.price) + '/' + esc(r.period) +
        (v ? ' · $' + v.toFixed(2) + '/sq ft' : '') +
        '<br><span class="pop-note">' + esc(r.product || '') + (r.promotion ? ' · ' + esc(r.promotion) : '') + '</span></div>';
    });
    html += '<div class="pop-note">Posted web rates; fees and taxes not included. Observed ' + esc(obs[0].observed || '') + '.</div>';
    return html;
  }

  function renderRentPanel() {
    var groups = rateGroups();
    var mappedObs = Object.keys(groups).length;
    var benchCities = {};
    DATA.benchmarks.forEach(function (b) { benchCities[b.city] = true; });
    var values = [];
    Object.keys(groups).forEach(function (fid) {
      groups[fid].forEach(function (r) { var v = psf(r); if (v != null) values.push(v); });
    });
    values.sort(function (a, b) { return a - b; });
    var html = '<h2>What the rent data can show</h2>' +
      '<p class="note">Only the report’s 22 facility-level observations are priced. The map keeps the full directory as faint context instead of pretending those observations cover the state.</p>' +
      '<div class="stat"><span>Facilities with a posted rate</span><b>' + mappedObs + '</b></div>' +
      '<div class="stat"><span>Rate observations</span><b>' + DATA.rates.length + '</b></div>' +
      '<div class="stat"><span>Published regional averages</span><b>' + DATA.benchmarks.length + ' (' + Object.keys(benchCities).length + ' city markers)</b></div>';
    if (values.length) {
      html += '<div class="stat"><span>Posted $/sq ft range</span><b>$' + values[0].toFixed(2) + '–$' + values[values.length - 1].toFixed(2) + '</b></div>';
    }
    html += '<h3>Colour scale ($/sq ft)</h3><div class="legend">' +
      '<label><span class="sw" style="background:#fee5d9"></span> under $0.55</label>' +
      '<label><span class="sw" style="background:#fcbba1"></span> $0.55–0.75</label>' +
      '<label><span class="sw" style="background:#fc9272"></span> $0.75–1.00</label>' +
      '<label><span class="sw" style="background:#fb6a4a"></span> $1.00–1.30</label>' +
      '<label><span class="sw" style="background:#a50f15"></span> $1.30 and up</label>' +
      '<label><span class="bench" style="display:inline-block">AVG</span> published regional average</label>' +
      '</div>' +
      '<h3>Observed listings</h3><table><thead><tr><th>Facility</th><th>Size</th><th class="num">$/mo</th><th class="num">$/sq ft</th></tr></thead><tbody>';
    var rows = [];
    Object.keys(groups).forEach(function (fid) {
      groups[fid].forEach(function (r) { rows.push({ f: fid, r: r }); });
    });
    rows.sort(function (a, b) { return (psf(b.r) || 0) - (psf(a.r) || 0); });
    rows.forEach(function (row) {
      var f = facilities.filter(function (x) { return x.id === row.f; })[0];
      var v = psf(row.r);
      html += '<tr><td>' + esc(f ? f.name : row.r.facility) + '<br><small>' + esc(row.r.city) + '</small></td><td>' + esc(row.r.size) +
        '</td><td class="num">' + money(row.r.price) + '</td><td class="num">' + (v != null ? '$' + v.toFixed(2) : '—') + '</td></tr>';
    });
    html += '</tbody></table><p class="note">These are posted web rates, not a survey: promotions, unit type, fees and taxes vary. The regional averages come from operator-published pages and use mixed amenities.</p>';
    panel(html);
  }

  function renderRent() {
    overlay.clearLayers();
    detail.clearLayers();
    map.setView([35.45, -97.4], 7);
    facilities.forEach(function (f) {
      if (!hasCoords(f)) return;
      L.circleMarker([f.lat, f.lng], {
        radius: 3, color: '#fff', weight: 0.5, fillColor: '#9a9a94', fillOpacity: 0.28
      }).addTo(overlay);
    });
    var groups = rateGroups();
    var pts = [];
    var rated = [];
    Object.keys(groups).forEach(function (fid) {
      var f = facilities.filter(function (x) { return x.id === fid; })[0];
      if (!f || !hasCoords(f)) return;
      var obs = groups[fid];
      var vals = obs.map(psf).filter(function (v) { return v != null; });
      var v = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
      var m = L.circleMarker([f.lat, f.lng], {
        radius: 8 + Math.min(4, obs.length), color: '#fff', weight: 2, fillColor: rentColor(v), fillOpacity: 0.95
      }).bindPopup(rentPopup(f, obs));
      if (v != null) rated.push({ lat: f.lat, lng: f.lng, m: m, label: '$' + v.toFixed(2) });
      overlay.addLayer(m);
      pts.push([f.lat, f.lng]);
    });
    var bgroups = benchmarkGroups();
    var cityCoords = {};
    facilities.forEach(function (f) {
      if (!hasCoords(f) || !f.city) return;
      var c = cityCoords[f.city] || (cityCoords[f.city] = { lat: 0, lng: 0, n: 0 });
      c.lat += f.lat; c.lng += f.lng; c.n++;
    });
    Object.keys(bgroups).forEach(function (city) {
      var c = cityCoords[city];
      if (!c) return;
      var ll = [c.lat / c.n, c.lng / c.n];
      var lines = bgroups[city].map(function (b) {
        return esc(b.company) + ' · ' + esc(b.size) + ' · ' + money(b.monthly) + '/mo<br><span class="pop-note">' + esc(b.basis) + '</span>';
      }).join('<hr style="border:0;border-top:1px solid #ddd;margin:6px 0">');
      var icon = L.divIcon({ className: '', html: '<div class="bench">AVG</div>', iconSize: [30, 18], iconAnchor: [15, 9] });
      L.marker(ll, { icon: icon }).bindPopup('<b>' + esc(city) + '</b><br><span class="pop-note">Operator-published regional average</span><hr style="border:0;border-top:1px solid #ddd;margin:6px 0">' + lines).addTo(overlay);
    });
    if (pts.length) map.fitBounds(pts, { padding: [50, 50], maxZoom: 8 });
    var placedRate = [];
    rated.forEach(function (x) {
      var p = map.latLngToContainerPoint([x.lat, x.lng]);
      if (placedRate.some(function (q) { return q.distanceTo(p) < 52; })) return;
      placedRate.push(p);
      x.m.bindTooltip(x.label, {
        permanent: true, direction: 'top', offset: [0, -7], className: 'rate-label', opacity: 1
      });
    });
    renderRentPanel();
  }

  /* ---------- switching ---------- */

  function render() {
    clearMap();
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.setAttribute('aria-selected', b.getAttribute('data-mode') === mode ? 'true' : 'false');
    });
    if (mode === 'density') renderDensity();
    else if (mode === 'ownership') renderOwnership();
    else renderRent();
  }

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      mode = b.getAttribute('data-mode');
      focusedCity = null;
      selectedCompany = null;
      render();
    });
  });

  render();
})();
</script>
</body>
</html>
